                    </form>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {(users||[]).map(u=><div key={u.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative">{u.role!=='admin' && <div className="absolute top-4 right-4 flex gap-2"><button onClick={()=>handleEdit(u)} className="text-blue-500 bg-blue-50 p-2 rounded"><i className="fa-solid fa-pen"></i></button><button onClick={()=>showConfirm('ডিলিট করবেন?', ()=>deleteUser(u.id))} className="text-red-500 bg-red-50 p-2 rounded"><i className="fa-solid fa-trash"></i></button></div>}<div className="font-bold text-slate-800 text-lg">{u.name} <span className="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-normal">{u.role==='admin'?'Admin':'Staff'}</span></div><div className="text-xs text-slate-500 my-1">{u.designation}</div><div className="text-xs font-mono text-blue-600 mt-2">ID: {u.loginId} | Pass: {u.password}</div></div>)}
                    </div>
                </div>
            );
        }

        function PaymentsView({ user, payments, addPayment, deletePayment, users, expenses, showAlert, showConfirm, logAction }) {
            const [amount, setAmount] = useState(''); const [note, setNote] = useState(''); const [empId, setEmpId] = useState('');
            const submitPay = (e) => { e.preventDefault(); const pUser = user.role==='admin'?(users||[]).find(u=>u.id.toString()===empId):user; if(!pUser)return; addPayment({ id: Date.now(), userId: pUser.id, userName: pUser.name, amount: parseFloat(amount), note, date: formatDateISO(new Date()), paidAt: getCurrentTimeStr() }); setAmount(''); setNote(''); showAlert('পেমেন্ট সেভ হয়েছে!'); };
            const displayPayments = user.role === 'admin' ? (payments||[]) : (payments||[]).filter(p=>p.userId===user.id);
            return (
                <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm animate-fade-in-up">
                    <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-6 border-b border-slate-100 pb-3"><i className="fa-solid fa-wallet text-blue-500"></i> পেমেন্ট</h2>
                    <form onSubmit={submitPay} className="mb-8 bg-slate-50 p-5 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">{user.role==='admin' && <div><label className="block text-xs font-bold mb-2">স্টাফ</label><select required value={empId} onChange={e=>setEmpId(e.target.value)} className="w-full border p-3.5 rounded-xl"><option value="">-- নির্বাচন করুন --</option>{(users||[]).filter(u=>u.role!=='admin').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div>}<div><label className="block text-xs font-bold mb-2">পরিমাণ (৳)</label><input type="number" required value={amount} onChange={e=>setAmount(e.target.value)} className="w-full border p-3.5 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">নোট</label><input required value={note} onChange={e=>setNote(e.target.value)} className="w-full border p-3.5 rounded-xl" /></div><div className="md:col-span-3"><button type="submit" className="bg-[#1e293b] text-white px-8 py-3.5 rounded-xl font-bold">পেমেন্ট এন্ট্রি</button></div></form>
                    <div className="grid grid-cols-1 gap-3">{displayPayments.length===0?<div className="p-6 text-center text-slate-400">কোনো রেকর্ড নেই</div>:displayPayments.map(p=><div key={p.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative">{user.role==='admin'&&<button onClick={()=>showConfirm('ডিলিট করবেন?',()=>deletePayment(p.id))} className="absolute top-4 right-4 text-red-500 bg-red-50 p-2 rounded"><i className="fa-solid fa-trash"></i></button>}<div className="font-bold text-slate-800">{p.userName}</div><div className="text-xs text-slate-400 mb-1">{formatDateEn(new Date(p.date))}</div><div className="text-sm text-slate-600 bg-slate-50 p-2 rounded my-2">{p.note}</div><div className="font-black text-green-600 text-xl">৳{p.amount}</div></div>)}</div>
                </div>
            );
        }

        function InvestView({ user, investments, addInvestment, updateInvestment, deleteInvestment, showConfirm, showAlert, logAction }) {
            const [amount, setAmount] = useState(''); const [reason, setReason] = useState(''); const [invDate, setInvDate] = useState(() => formatDateISO(new Date()));
            const submitInvest = (e) => { e.preventDefault(); addInvestment({ id: Date.now(), userId: user.id, userName: user.name, amount: parseFloat(amount), reason, date: invDate }); setAmount(''); setReason(''); showAlert('ইনভেস্টমেন্ট সেভ হয়েছে!'); };
            const displayInvest = investments || [];
            return (
                <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm animate-fade-in-up">
                    <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-6 border-b border-slate-100 pb-3"><i className="fa-solid fa-chart-line text-blue-500"></i> ইনভেস্টমেন্ট</h2>
                    <form onSubmit={submitInvest} className="mb-8 bg-slate-50 p-5 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4"><div><label className="block text-xs font-bold mb-2">তারিখ</label><input type="date" required value={invDate} onChange={e=>setInvDate(e.target.value)} className="w-full border p-3.5 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">পরিমাণ (৳)</label><input type="number" required value={amount} onChange={e=>setAmount(e.target.value)} className="w-full border p-3.5 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">কীসের জন্য</label><input required value={reason} onChange={e=>setReason(e.target.value)} className="w-full border p-3.5 rounded-xl" /></div><div className="md:col-span-3"><button type="submit" className="bg-[#1e293b] text-white px-8 py-3.5 rounded-xl font-bold">ইনভেস্ট এন্ট্রি</button></div></form>
                    <div className="grid grid-cols-1 gap-3">{displayInvest.length===0?<div className="p-6 text-center text-slate-400">কোনো রেকর্ড নেই</div>:displayInvest.map(i=><div key={i.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative">{user.role==='admin'&&<button onClick={()=>showConfirm('ডিলিট করবেন?',()=>deleteInvestment(i.id))} className="absolute top-4 right-4 text-red-500 bg-red-50 p-2 rounded"><i className="fa-solid fa-trash"></i></button>}<div className="font-bold text-slate-800">{i.userName} <span className="text-xs text-slate-400 font-normal">({formatDateEn(new Date(i.date))})</span></div><div className="text-sm text-slate-600 bg-slate-50 p-2 rounded my-2">{i.reason}</div><div className="font-black text-indigo-600 text-xl">৳{i.amount}</div></div>)}</div>
                </div>
            );
        }

        function WebsiteSettingsView({ user, config, updateConfig, packages, addPackage, deletePackage, complaints, deleteComplaint, reviews, deleteReview, showAlert, showConfirm }) {
            const canBanners = user.role === 'admin' || user.canManageBanners; const canPackages = user.role === 'admin' || user.canManagePackages; const canComplaints = user.role === 'admin' || user.canManageComplaints; const canReviews = user.role === 'admin' || user.canManageReviews; const canFTP = user.role === 'admin' || user.canManageFTP;
            const [activeTab, setActiveTab] = useState(canBanners ? 'general' : canPackages ? 'packages' : canComplaints ? 'complaints' : canReviews ? 'reviews' : canFTP ? 'ftp' : '');
            const [adsStatus, setAdsStatus] = useState(config?.adsStatus||false); const [popupUrl, setPopupUrl] = useState(config?.popupUrl||''); const [newBanner, setNewBanner] = useState(''); const [ftpLink, setFtpLink] = useState(config?.ftpLink||'');
            const [pkgName, setPkgName] = useState(''); const [pkgSpeed, setPkgSpeed] = useState(''); const [pkgPrice, setPkgPrice] = useState(''); const [pkgFeatures, setPkgFeatures] = useState('');

            const saveGeneral = () => { updateConfig(1, { ...config, adsStatus, popupUrl }); showAlert('সেটিংস সেভ হয়েছে!'); };
            const saveFtp = () => { updateConfig(1, { ...config, ftpLink }); showAlert('FTP লিংক সেভ হয়েছে!'); };
            const addBanner = () => { if(!newBanner)return; updateConfig(1, { ...config, banners: [...(config?.banners||[]), newBanner] }); setNewBanner(''); showAlert('ব্যানার যুক্ত হয়েছে!'); };
            const submitPackage = (e) => { e.preventDefault(); addPackage({ id: Date.now(), name: pkgName, speed: pkgSpeed, price: parseFloat(pkgPrice), features: pkgFeatures.split(',').map(f=>f.trim()) }); setPkgName(''); setPkgSpeed(''); setPkgPrice(''); setPkgFeatures(''); showAlert('প্যাকেজ যুক্ত হয়েছে!'); };

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in-up">
                    <div className="bg-[#2d1960] p-6 text-white"><h2 className="text-xl font-bold flex items-center gap-2"><i className="fa-solid fa-globe"></i> ওয়েবসাইট কন্ট্রোল</h2></div>
                    <div className="flex overflow-x-auto bg-slate-50 border-b border-slate-200 scrollbar-hide">
                        {canBanners && <button onClick={()=>setActiveTab('general')} className={`px-6 py-4 text-sm font-bold whitespace-nowrap ${activeTab==='general'?'border-b-2 border-[#5e3186] text-[#2d1960]':'text-slate-500'}`}>ব্যানার</button>}
                        {canPackages && <button onClick={()=>setActiveTab('packages')} className={`px-6 py-4 text-sm font-bold whitespace-nowrap ${activeTab==='packages'?'border-b-2 border-[#5e3186] text-[#2d1960]':'text-slate-500'}`}>প্যাকেজ</button>}
                        {canComplaints && <button onClick={()=>setActiveTab('complaints')} className={`px-6 py-4 text-sm font-bold whitespace-nowrap ${activeTab==='complaints'?'border-b-2 border-[#5e3186] text-[#2d1960]':'text-slate-500'}`}>অভিযোগ</button>}
                        {canReviews && <button onClick={()=>setActiveTab('reviews')} className={`px-6 py-4 text-sm font-bold whitespace-nowrap ${activeTab==='reviews'?'border-b-2 border-[#5e3186] text-[#2d1960]':'text-slate-500'}`}>রিভিউ</button>}
                        {canFTP && <button onClick={()=>setActiveTab('ftp')} className={`px-6 py-4 text-sm font-bold whitespace-nowrap ${activeTab==='ftp'?'border-b-2 border-[#5e3186] text-[#2d1960]':'text-slate-500'}`}>FTP</button>}
                    </div>
                    <div className="p-6">
                        {activeTab === 'general' && <div>
                            <div className="mb-6"><h3 className="font-bold text-slate-800 mb-2">পপ-আপ অ্যাডস</h3><div className="flex gap-2"><input type="text" value={popupUrl} onChange={e=>setPopupUrl(e.target.value)} className="flex-1 border p-3 rounded-xl outline-none" placeholder="Image URL..." /><label className="flex items-center gap-2 bg-slate-100 px-4 rounded-xl font-bold cursor-pointer"><input type="checkbox" checked={adsStatus} onChange={e=>setAdsStatus(e.target.checked)} className="w-5 h-5" /> Active</label><button onClick={saveGeneral} className="bg-[#2d1960] text-white px-6 py-3 rounded-xl font-bold">Save</button></div></div>
                            <div><h3 className="font-bold text-slate-800 mb-2">হোমপেজ ব্যানার</h3><div className="flex gap-2 mb-4"><input type="text" value={newBanner} onChange={e=>setNewBanner(e.target.value)} className="flex-1 border p-3 rounded-xl outline-none" placeholder="Banner Image URL..." /><button onClick={addBanner} className="bg-[#5e3186] text-white px-6 py-3 rounded-xl font-bold">Add</button></div><div className="grid grid-cols-2 gap-4">{(config?.banners||[]).map((url, i)=><div key={i} className="relative aspect-video bg-slate-100 rounded-xl overflow-hidden group"><img src={url} className="w-full h-full object-cover" /><button onClick={()=>showConfirm('Delete?', ()=>{const b=[...config.banners]; b.splice(i,1); updateConfig(1,{...config, banners:b});})} className="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"><i className="fa-solid fa-trash"></i></button></div>)}</div></div>
                        </div>}
                        {activeTab === 'packages' && <div><form onSubmit={submitPackage} className="bg-slate-50 p-5 rounded-2xl mb-6 grid grid-cols-1 md:grid-cols-2 gap-4"><div><input required value={pkgName} onChange={e=>setPkgName(e.target.value)} className="w-full border p-3 rounded-xl" placeholder="Package Name" /></div><div><input required value={pkgSpeed} onChange={e=>setPkgSpeed(e.target.value)} className="w-full border p-3 rounded-xl" placeholder="Speed (e.g. 5 Mbps)" /></div><div><input type="number" required value={pkgPrice} onChange={e=>setPkgPrice(e.target.value)} className="w-full border p-3 rounded-xl" placeholder="Price (৳)" /></div><div><input required value={pkgFeatures} onChange={e=>setPkgFeatures(e.target.value)} className="w-full border p-3 rounded-xl" placeholder="Features (comma separated)" /></div><div className="md:col-span-2"><button type="submit" className="bg-[#2d1960] text-white px-8 py-3 rounded-xl font-bold">Add Package</button></div></form><div className="grid grid-cols-1 md:grid-cols-3 gap-4">{(packages||[]).map(p=><div key={p.id} className="bg-white border-2 border-slate-100 p-4 rounded-xl relative"><button onClick={()=>deletePackage(p.id)} className="absolute top-4 right-4 text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button><h3 className="font-bold text-lg">{p.name}</h3><div className="text-[#5e3186] font-black text-2xl my-1">{p.speed}</div><div className="font-bold text-slate-600">৳{p.price}</div></div>)}</div></div>}
                        {activeTab === 'complaints' && <div className="space-y-4">{(complaints||[]).map(c=><div key={c.id} className="bg-red-50 border border-red-100 p-4 rounded-xl relative"><button onClick={()=>deleteComplaint(c.id)} className="absolute top-4 right-4 text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button><div className="font-bold text-slate-800">{c.name} <span className="text-xs font-normal text-slate-500">({c.phone}) - {c.date}</span></div><p className="text-sm mt-2">{c.details}</p></div>)}</div>}
                        {activeTab === 'reviews' && <div className="space-y-4">{(reviews||[]).map(r=><div key={r.id} className="bg-yellow-50 border border-yellow-100 p-4 rounded-xl relative"><button onClick={()=>deleteReview(r.id)} className="absolute top-4 right-4 text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button><div className="font-bold text-slate-800">{r.customerName} <span className="text-xs font-normal text-slate-500">- {r.date}</span></div><div className="text-yellow-500 text-xs my-1">{'★'.repeat(r.rating)}</div><p className="text-sm mt-1">{r.comment}</p></div>)}</div>}
                        {activeTab === 'ftp' && <div className="flex gap-2"><input type="text" value={ftpLink} onChange={e=>setFtpLink(e.target.value)} className="flex-1 border p-3 rounded-xl outline-none" placeholder="FTP Link (e.g. http://10.10.10.10)" /><button onClick={saveFtp} className="bg-[#2d1960] text-white px-6 py-3 rounded-xl font-bold">Save FTP</button></div>}
                    </div>
                </div>
            );
        }

        function LogsView({ logs }) {
            return (
                <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm animate-fade-in-up">
                    <h2 className="text-xl font-bold text-slate-800 mb-4"><i className="fa-solid fa-clipboard-list"></i> সিস্টেম লগ</h2>
                    <div className="space-y-2">{(logs||[]).slice(0,100).map(l=><div key={l.id} className="text-xs text-slate-600 border-b border-slate-100 pb-2"><span className="text-blue-500 font-bold">{new Date(l.timestamp).toLocaleString()}</span> - <span className="font-bold">{l.userName}</span>: {l.action}</div>)}</div>
                </div>
            );
        }

        function RealTimeClock() { const [time, setTime] = useState(new Date()); useEffect(() => { const timer = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(timer); }, []); return <span>{new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true }).format(time)}</span>; }
        function AnalogClock() { const [time, setTime] = useState(new Date()); useEffect(() => { const timer = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(timer); }, []); const secDeg = time.getSeconds() * 6; const minDeg = time.getMinutes() * 6 + time.getSeconds() * 0.1; const hrDeg = (time.getHours() % 12) * 30 + time.getMinutes() * 0.5; return ( <div className="relative w-[150px] h-[150px] md:w-48 md:h-48 rounded-full border-[6px] border-slate-200 shadow-[inset_0_2px_15px_rgba(0,0,0,0.1)] bg-white flex items-center justify-center"> <span className="absolute top-2 text-xs md:text-sm font-bold text-slate-400">12</span> <span className="absolute right-3 text-xs md:text-sm font-bold text-slate-400">3</span> <span className="absolute bottom-2 text-xs md:text-sm font-bold text-slate-400">6</span> <span className="absolute left-3 text-xs md:text-sm font-bold text-slate-400">9</span> <div className="absolute w-1 md:w-1.5 h-10 md:h-12 bg-slate-800 rounded-full origin-bottom" style={{ transform: `translateY(-50%) rotate(${hrDeg}deg)` }}></div> <div className="absolute w-0.5 md:w-1 h-14 md:h-16 bg-blue-600 rounded-full origin-bottom" style={{ transform: `translateY(-50%) rotate(${minDeg}deg)` }}></div> <div className="absolute w-[1px] md:w-0.5 h-16 md:h-20 bg-red-500 rounded-full origin-bottom" style={{ transform: `translateY(-50%) rotate(${secDeg}deg)` }}></div> <div className="w-3 h-3 md:w-4 md:h-4 bg-slate-800 border-2 border-white rounded-full z-10 absolute shadow-sm"></div> </div> ); }
        function MiniCalendar() { const today = new Date(); const monthYear = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(today); const daysInWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; const year = today.getFullYear(); const month = today.getMonth(); const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate(); return ( <div className="w-full"> <div className="flex justify-between items-center mb-4 md:mb-5 pb-3 border-b border-slate-600"> <button className="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-full text-xs md:text-sm hover:bg-blue-600 transition"><i className="fa-solid fa-chevron-left"></i></button> <span className="text-lg md:text-xl font-bold tracking-wide">{monthYear}</span> <button className="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-full text-xs md:text-sm hover:bg-blue-600 transition"><i className="fa-solid fa-chevron-right"></i></button> </div> <div className="overflow-x-auto w-full pb-2 scrollbar-hide"> <div className="grid grid-cols-7 gap-1 md:gap-2 text-center text-xs md:text-sm min-w-[240px]"> {daysInWeek.map(d => <div key={d} className="text-blue-400 font-bold py-1 text-[10px] md:text-xs uppercase">{d}</div>)} {Array(firstDay).fill(null).map((_, i) => <div key={`blank-${i}`} className="py-1 md:py-2"></div>)} {Array.from({length: daysInMonth}, (_, i) => i + 1).map(d => ( <div key={d} className={`py-1 md:py-1.5 rounded-lg flex items-center justify-center transition-colors ${d === today.getDate() ? 'bg-blue-500 text-white font-bold shadow-lg shadow-blue-500/40' : 'hover:bg-slate-700 text-slate-300'}`}> {d} </div> ))} </div> </div> </div> ); }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
