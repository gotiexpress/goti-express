                                      <button type="submit" className="flex-1 bg-blue-600 text-white px-4 py-3 rounded-xl hover:bg-blue-700 font-bold active:scale-95 transition-all">
                                          {editingSalId ? 'আপডেট' : 'সেটআপ'}
                                      </button>
                                      {editingSalId && <button type="button" onClick={cancelEditConfig} className="bg-slate-200 text-slate-700 px-4 py-3 rounded-xl font-bold hover:bg-slate-300">Cancel</button>}
                                  </div>
                              </form>
                            </div>
                         )}

                         <div>
                            <h3 className="text-lg font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">বেতনের বিস্তারিত ও হিস্টোরি</h3>
                            <div className="space-y-6">
                               {displaySalaries.length === 0 ? (
                                   <div className="p-8 text-center text-slate-400 border border-dashed border-slate-300 rounded-2xl bg-slate-50 font-medium">কোনো রেকর্ড পাওয়া যায়নি</div>
                               ) : (
                                  displaySalaries.sort((a,b) => (b.month||'').localeCompare(a.month||'')).map(rawSal => {
                                      const sal = getCalculatedSalary(rawSal);
                                      return (
                                          <div key={sal.id} className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                                              <div className="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center flex-wrap gap-2">
                                                  <div className="flex items-center gap-3">
                                                      <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded-lg text-sm font-bold tracking-wide"><i className="fa-regular fa-calendar-days mr-1"></i> {sal.month}</span>
                                                      <span className="font-bold text-slate-800">{sal.userName}</span>
                                                  </div>
                                                  <div className="flex items-center gap-3">
                                                      <span className={`px-3 py-1 rounded-lg text-xs font-bold uppercase ${sal.status === 'পেইড' ? 'bg-green-100 text-green-700' : sal.status === 'অনুমোদিত' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}`}>
                                                          {sal.status}
                                                      </span>
                                                      {user.role === 'admin' && sal.status !== 'পেইড' && (
                                                          <div className="flex gap-1">
                                                              {sal.status === 'পেন্ডিং' && <button onClick={()=>updateSalary(sal.id, {status: 'অনুমোদিত'})} className="text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700">Approve</button>}
                                                              {sal.status === 'অনুমোদিত' && <button onClick={()=>updateSalary(sal.id, {status: 'পেইড'})} className="text-xs bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700">Mark Paid</button>}
                                                          </div>
                                                      )}
                                                  </div>
                                              </div>
                                              
                                              <div className="p-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                                                  <div className="bg-slate-50 p-3 rounded-xl text-center">
                                                      <p className="text-[10px] text-slate-500 font-bold mb-1">মূল বেতন</p>
                                                      <p className="text-lg font-bold text-slate-800">৳{sal.baseSalary}</p>
                                                  </div>
                                                  <div className="bg-indigo-50 p-3 rounded-xl text-center">
                                                      <p className="text-[10px] text-indigo-500 font-bold mb-1">মোট অগ্রিম (-)</p>
                                                      <p className="text-lg font-bold text-indigo-700">৳{sal.advances}</p>
                                                  </div>
                                                  <div className="bg-red-50 p-3 rounded-xl text-center">
                                                      <p className="text-[10px] text-red-500 font-bold mb-1">মোট কর্তন (-)</p>
                                                      <p className="text-lg font-bold text-red-600">৳{sal.deductions}</p>
                                                  </div>
                                                  <div className="bg-green-50 p-3 rounded-xl border border-green-200 text-center">
                                                      <p className="text-[10px] text-green-600 font-bold mb-1">প্রাপ্য বেতন (Net)</p>
                                                      <p className="text-xl font-black text-green-700">৳{sal.net}</p>
                                                  </div>
                                              </div>

                                              <div className="px-4 pb-4 border-t border-slate-100 pt-4 grid grid-cols-1 lg:grid-cols-2 gap-6">
                                                  {/* History List */}
                                                  <div>
                                                      <h4 className="text-sm font-bold text-slate-700 mb-3"><i className="fa-solid fa-list text-slate-400 mr-1"></i> লেনদেনের হিস্টোরি</h4>
                                                      <div className="space-y-2 max-h-40 overflow-y-auto pr-2">
                                                          {sal.histories.length === 0 ? <p className="text-xs text-slate-400 italic">কোনো রেকর্ড নেই</p> : 
                                                              sal.histories.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(h => (
                                                                  <div key={h.id} className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100 text-sm">
                                                                      <div>
                                                                          <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold uppercase mr-2 ${h.type === 'advance' ? 'bg-indigo-100 text-indigo-700' : 'bg-red-100 text-red-700'}`}>{h.type === 'advance' ? 'অগ্রিম' : 'কর্তন'}</span>
                                                                          <span className="text-xs text-slate-500">{formatDateEn(new Date(h.date))}</span>
                                                                          <p className="text-xs text-slate-700 mt-0.5">{h.reason}</p>
                                                                      </div>
                                                                      <div className="flex items-center gap-3">
                                                                          <span className={`font-bold ${h.type === 'advance' ? 'text-indigo-600' : 'text-red-600'}`}>৳{h.amount}</span>
                                                                          {user.role === 'admin' && sal.status !== 'পেইড' && (
                                                                              <button onClick={()=>deleteSalaryHistory(h.id)} className="text-slate-300 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                                                                          )}
                                                                      </div>
                                                                  </div>
                                                              ))
                                                          }
                                                      </div>
                                                  </div>

                                                  {/* Add Entry Form (Admin Only) */}
                                                  {user.role === 'admin' && sal.status !== 'পেইড' && (
                                                      <form onSubmit={(e)=>submitSalaryHistory(e, sal.id)} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                                          <h4 className="text-sm font-bold text-slate-700 mb-3"><i className="fa-solid fa-plus text-slate-400 mr-1"></i> নতুন রেকর্ড যুক্ত করুন</h4>
                                                          <div className="grid grid-cols-2 gap-3 mb-3">
                                                              <div>
                                                                  <label className="block text-[10px] font-bold text-slate-500 mb-1">তারিখ</label>
                                                                  <input type="date" required value={histDate} onChange={e=>setHistDate(e.target.value)} className="w-full text-xs border border-slate-300 p-2 rounded focus:ring-1 focus:ring-blue-500" />
                                                              </div>
                                                              <div>
                                                                  <label className="block text-[10px] font-bold text-slate-500 mb-1">ধরন</label>
                                                                  <select value={histType} onChange={e=>setHistType(e.target.value)} className="w-full text-xs border border-slate-300 p-2 rounded focus:ring-1 focus:ring-blue-500">
                                                                      <option value="advance">অগ্রিম/জমা</option>
                                                                      <option value="deduction">কর্তন/বকেয়া</option>
                                                                  </select>
                                                              </div>
                                                              <div className="col-span-2">
                                                                  <label className="block text-[10px] font-bold text-slate-500 mb-1">পরিমাণ (৳)</label>
                                                                  <input type="number" required value={histAmount} onChange={e=>setHistAmount(e.target.value)} className="w-full text-xs border border-slate-300 p-2 rounded focus:ring-1 focus:ring-blue-500" placeholder="0" />
                                                              </div>
                                                              <div className="col-span-2">
                                                                  <label className="block text-[10px] font-bold text-slate-500 mb-1">বিবরণ/মন্তব্য</label>
                                                                  <input type="text" required value={histReason} onChange={e=>setHistReason(e.target.value)} className="w-full text-xs border border-slate-300 p-2 rounded focus:ring-1 focus:ring-blue-500" placeholder="কারণ লিখুন..." />
                                                              </div>
                                                          </div>
                                                          <button type="submit" className="w-full bg-slate-800 text-white text-xs font-bold py-2 rounded hover:bg-slate-900 transition">যুক্ত করুন</button>
                                                      </form>
                                                  )}
                                              </div>
                                          </div>
                                      );
                                  })
                               )}
                            </div>
                         </div>
                     </div>
                 )}

                 {activeTab === 'reseller' && (
                     <div className="animate-fade-in-up space-y-8">
                         {/* Admin Reseller Commission Control */}
                         {user.role === 'admin' && (
                             <div className="bg-purple-50 p-5 rounded-2xl border border-purple-100">
                                 <h3 className="font-bold text-slate-800 mb-3"><i className="fa-solid fa-percent text-purple-500 mr-2"></i> রিসেলার কমিশন সেটআপ</h3>
                                 <div className="flex flex-col sm:flex-row gap-4">
                                     <select value={selectedResellerUser} onChange={e=>setSelectedResellerUser(e.target.value)} className="flex-1 border border-slate-300 p-3 rounded-xl outline-none">
                                         <option value="">-- স্টাফ/রিসেলার নির্বাচন করুন --</option>
                                         {(users || []).filter(u=>u.role!=='admin').map(u=><option key={u.id} value={u.id}>{u.name} (বর্তমান: {u.resellerCommission||0}%)</option>)}
                                     </select>
                                     <div className="relative w-32">
                                         <input type="number" value={resellerCommissionInput} onChange={e=>setResellerCommissionInput(e.target.value)} placeholder="%" className="w-full border border-slate-300 p-3 rounded-xl outline-none pr-8" />
                                         <span className="absolute right-3 top-3.5 text-slate-400 font-bold">%</span>
                                     </div>
                                     <button onClick={()=>{if(selectedResellerUser) updateResellerCommission(selectedResellerUser, resellerCommissionInput)}} className="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-purple-700">সেট করুন</button>
                                 </div>
                             </div>
                         )}

                         {/* Entry Form */}
                         <form onSubmit={submitResellerBill} className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                             <h3 className="font-bold text-slate-800 mb-4">নতুন কাস্টমার বিল এন্ট্রি (রিসেলার)</h3>
                             {user.role === 'admin' && (
                                <div className="mb-4">
                                    <label className="block text-xs font-bold mb-1 text-slate-700">রিসেলার/স্টাফ</label>
                                    <select required value={selectedResellerUser} onChange={e=>setSelectedResellerUser(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl bg-white outline-none">
                                        <option value="">-- নির্বাচন করুন --</option>
                                        {(users || []).filter(u=>u.role!=='admin').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                                    </select>
                                </div>
                             )}
                             <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                 <div>
                                     <label className="block text-xs font-bold mb-1 text-slate-700">কাস্টমার আইডি</label>
                                     <input type="text" required value={resellerId} onChange={e=>setResellerId(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="ID..." />
                                 </div>
                                 <div>
                                     <label className="block text-xs font-bold mb-1 text-slate-700">কাস্টমারের নাম</label>
                                     <input type="text" required value={resellerName} onChange={e=>setResellerName(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="Name..." />
                                 </div>
                                 <div>
                                     <label className="block text-xs font-bold mb-1 text-slate-700">বিল (৳)</label>
                                     <input type="number" required value={resellerBillAmt} onChange={e=>setResellerBillAmt(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl bg-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
                                 </div>
                             </div>
                             <button type="submit" className="mt-4 bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-md">এন্ট্রি করুন</button>
                         </form>

                         {/* Summary & History */}
                         <div>
                             <h3 className="font-bold text-slate-800 mb-4">রিসেলার বিল সামারি ও হিস্টোরি</h3>
                             
                             {/* Summary Cards */}
                             <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                 {Object.values(resellerSummary).map((sum, i) => (
                                     <div key={i} className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                                         <div className="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                                             <span className="font-bold text-slate-800">{sum.userName}</span>
                                             <span className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded font-bold">{sum.month}</span>
                                         </div>
                                         <div className="flex justify-between text-sm mb-1">
                                             <span className="text-slate-500">মোট কালেক্টেড বিল:</span>
                                             <span className="font-bold">৳{sum.totalBill}</span>
                                         </div>
                                         <div className="flex justify-between text-sm mb-1">
                                             <span className="text-slate-500">কমিশন রেট:</span>
                                             <span className="font-bold text-blue-600">{sum.commissionPercent}%</span>
                                         </div>
                                         <div className="flex justify-between text-sm pt-2 mt-2 border-t border-slate-100">
                                             <span className="font-bold text-slate-700">প্রাপ্য কমিশন:</span>
                                             <span className="font-black text-green-600 text-lg">৳{sum.commissionEarned}</span>
                                         </div>
                                     </div>
                                 ))}
                             </div>

                             {/* Detailed Table */}
                             <div className="overflow-x-auto rounded-xl border border-slate-200">
                                 <table className="w-full text-left text-sm">
                                     <thead className="bg-slate-50 text-slate-500 uppercase text-xs">
                                         <tr>
                                             <th className="p-3">তারিখ</th>
                                             {user.role === 'admin' && <th className="p-3">রিসেলার</th>}
                                             <th className="p-3">কাস্টমার আইডি</th>
                                             <th className="p-3">নাম</th>
                                             <th className="p-3 text-right">বিল</th>
                                             <th className="p-3 text-right">কমিশন (%)</th>
                                             <th className="p-3 text-center">অ্যাকশন</th>
                                         </tr>
                                     </thead>
                                     <tbody className="divide-y divide-slate-100">
                                         {displayResellerBills.length === 0 ? <tr><td colSpan="7" className="p-6 text-center text-slate-400">কোনো রেকর্ড নেই</td></tr> : 
                                             displayResellerBills.sort((a,b)=>b.id-a.id).map(bill => (
                                                 <tr key={bill.id} className="hover:bg-slate-50">
                                                     <td className="p-3 text-slate-500">{formatDateEn(new Date(bill.date))}</td>
                                                     {user.role === 'admin' && <td className="p-3 font-bold">{bill.userName}</td>}
                                                     <td className="p-3 font-mono text-slate-600">{bill.customerId}</td>
                                                     <td className="p-3 font-medium">{bill.customerName}</td>
                                                     <td className="p-3 text-right font-bold">৳{bill.billAmount}</td>
                                                     <td className="p-3 text-right text-blue-600 font-bold">{bill.commissionPercent}%</td>
                                                     <td className="p-3 text-center">
                                                         <button onClick={()=>showConfirm('ডিলিট করবেন?', ()=>deleteResellerBill(bill.id))} className="text-red-400 hover:text-red-600 bg-red-50 p-1.5 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                                     </td>
                                                 </tr>
                                             ))
                                         }
                                     </tbody>
                                 </table>
                             </div>
                         </div>
                     </div>
                 )}
              </div>
           );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
