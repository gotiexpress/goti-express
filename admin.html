<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>গতি এক্সপ্রেস - এডমিন প্যানেল</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* Prevent Copy Global */
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none;
        }
        /* Allow copy/typing only inside input fields */
        input, textarea, select { 
            user-select: text !important; 
            -webkit-user-select: text !important; 
            -moz-user-select: text !important;

        @keyframes fadeInUp {

        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#0f172a] m-0 p-0 overflow-hidden" oncopy="return false" oncut="return false" oncontextmenu="return false">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 🔴 ফায়ারবেস ক্লাউড ডাটাবেস সেটআপ
        const firebaseConfig = {
            apiKey: "AIzaSyBmJGTuAvMF9FM6MwOSi4BZqFmGyqb2Yd0",
            authDomain: "goti-express.firebaseapp.com",
            projectId: "goti-express",
            storageBucket: "goti-express.firebasestorage.app",
            messagingSenderId: "427378824805",
            appId: "1:427378824805:web:54373b156fc7f40f65588c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Utilities
        const formatDateEn = (date) => {
            try { return new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' }).format(date); }
            catch (e) { return 'Invalid'; }
        };
        
        const formatDateISO = (date) => {
            const d = new Date(date);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };
        
        const formatTimeEn = (date) => {
            return new Intl.DateTimeFormat('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true }).format(date);
        };

        const bengaliToEnglish = (str) => str.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d).toString());
        
        const parseDateFromAnyFormat = (val) => {
            if (!val) return null;
            let s = val;
            s = bengaliToEnglish(s);
            let parts = s.split('/');
            if (parts.length === 3) {
                let d = parseInt(parts[0]), m = parseInt(parts[1])-1, y = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return new Date(y, m, d);
            }
            parts = s.split('-');
            if (parts.length === 3) {
                let y = parseInt(parts[0]), m = parseInt(parts[1])-1, d = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return new Date(y, m, d);
            }
            return null;
        };

        const migrateDates = (items, fields = ['date']) => {
            return items.map(item => {
                const newItem = {...item};
                fields.forEach(f => {
                    if (typeof newItem[f] === 'string') {
                        const d = parseDateFromAnyFormat(newItem[f]);
                        if (d && !isNaN(d)) newItem[f] = formatDateISO(d);
                    }
                });
                return newItem;
            });
        };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { 
                    return initialValue; 
                }
            });
            
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(storedValue)); } 
                catch (error) {}
            }, [key, storedValue]);
            
            return [storedValue, setStoredValue];
        }

        function useDatabase(collectionName, initialData = []) {
            const [data, setData] = useState(() => {
                try {
                    const local = window.localStorage.getItem('goti_' + collectionName);
                    if (local) {
                        let parsed = JSON.parse(local);
                        if (['attendances','expenses','salaries','reports','incomes', 'costs', 'stock', 'budgets', 'salaryHistories', 'resellerBills'].includes(collectionName)) {
                            parsed = migrateDates(parsed, ['date']);
                        }
                        return parsed || [];
                    }
                } catch(e) { console.error(e); }
                return initialData;
            });

            useEffect(() => {
                const unsubscribe = db.collection(collectionName).orderBy('id', 'desc').onSnapshot(snapshot => {
                    let docs = snapshot.docs.map(doc => doc.data());
                    if (docs.length > 0) {
                        if (['attendances','expenses','salaries','reports','incomes', 'costs', 'stock', 'budgets', 'salaryHistories', 'resellerBills'].includes(collectionName)) {
                            docs = migrateDates(docs, ['date']);
                        }
                        setData(docs);
                        window.localStorage.setItem('goti_' + collectionName, JSON.stringify(docs));
                    } else if (initialData.length > 0 && data.length === 0) {
                        initialData.forEach(item => 
                            db.collection(collectionName).doc(item.id.toString()).set(item)
                              .catch(err => console.log("Init write error:", err))
                        );
                    }
                }, error => console.error("Cloud Error:", error));
                
                return () => unsubscribe();
            }, [collectionName]);

            const addData = (newItem) => {
                const newData = [newItem, ...(data || [])];
                setData(newData);
                window.localStorage.setItem('goti_' + collectionName, JSON.stringify(newData));
                db.collection(collectionName).doc(newItem.id.toString()).set(newItem).catch(err => console.log("Add error:", err));
            };

            const updateData = (id, updatedFields) => {
                const newData = (data || []).map(item => item.id === id ? { ...item, ...updatedFields } : item);
                setData(newData);
                window.localStorage.setItem('goti_' + collectionName, JSON.stringify(newData));
                db.collection(collectionName).doc(id.toString()).update(updatedFields).catch(err => console.log("Update error:", err));
            };

            const deleteData = (id) => {
                const newData = (data || []).filter(item => item.id !== id);
                setData(newData);
                window.localStorage.setItem('goti_' + collectionName, JSON.stringify(newData));
                db.collection(collectionName).doc(id.toString()).delete().catch(err => console.log("Delete error:", err));
            };

            return [data || [], addData, updateData, deleteData];
        }

        const getCurrentTimeStr = () => {
            return new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Dhaka', year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', hour12: true 
            }).format(new Date());
        };

        const initialUsers = [
          { 
              id: 1, name: 'Admin', loginId: 'sreebashkumar65@gmail.com', password: '01815151122', 
              role: 'admin', designation: 'Administrator', avatar: null, resellerCommission: 0,
              canInvest: true, canSubmitExp: true, canApproveExp: true, canPayExp: true, canViewReports: true, 
              canSubmitAttendance: true, canApproveLeave: true, canSubmitIncome: true, canManageCosts: true,
              canManageBanners: true, canManagePackages: true, canManageComplaints: true, canManageReviews: true, 
              canManageFTP: true, canViewBalance: true, canManageStock: true, canManageBudget: true
          },
          { 
              id: 2, name: 'স্বাধীন আহমেদ তামিম', loginId: '01813910850', password: '01813910850', 
              role: 'staff', designation: 'Technician', avatar: null, resellerCommission: 0,
              canInvest: false, canSubmitExp: true, canApproveExp: false, canPayExp: false, canViewReports: false, 
              canSubmitAttendance: false, canApproveLeave: false, canSubmitIncome: false, canManageCosts: false,
              canManageBanners: false, canManagePackages: false, canManageComplaints: false, canManageReviews: false, 
              canManageFTP: false, canViewBalance: false, canManageStock: false, canManageBudget: false
          }
        ];

        function App() {
          const [isLoggedIn, setIsLoggedIn] = useLocalStorage('goti_isLoggedIn', false);
          const [currentUser, setCurrentUser] = useLocalStorage('goti_currentUser', null);
          const [currentView, setCurrentView] = useLocalStorage('goti_currentView', 'dashboard');
          const [sidebarOpen, setSidebarOpen] = useState(false);

          const [dialog, setDialog] = useState({ open: false, type: '', msg: '', action: null, inputVal: '' });
          
          const showAlert = (msg) => setDialog({ open: true, type: 'alert', msg, action: null, inputVal: '' });
          const showConfirm = (msg, action) => setDialog({ open: true, type: 'confirm', msg, action, inputVal: '' });
          const showPrompt = (msg, action) => setDialog({ open: true, type: 'prompt', msg, action, inputVal: '' });

          // Databases
          const [users, addUser, updateUser, deleteUser] = useDatabase('users', initialUsers);
          const [attendances, addAttendance] = useDatabase('attendances', []);
          const [leaves, addLeave, updateLeave, deleteLeave] = useDatabase('leaves', []);
          const [expenses, addExpense, updateExpense, deleteExpense] = useDatabase('expenses', []);
          const [reports, addReport, updateReport, deleteReport] = useDatabase('reports', []);
          const [payments, addPaymentBase, updatePayment, deletePayment] = useDatabase('payments', []);
          const [salaries, addSalaryBase, updateSalary, deleteSalary] = useDatabase('salaries', []);
          const [salaryHistories, addSalaryHistory, updateSalaryHistory, deleteSalaryHistory] = useDatabase('salaryHistories', []);
          const [resellerBills, addResellerBill, updateResellerBill, deleteResellerBill] = useDatabase('resellerBills', []);
          const [investments, addInvestment, updateInvestment, deleteInvestment] = useDatabase('investments', []);
          const [incomes, addIncome, updateIncome, deleteIncome] = useDatabase('incomes', []);
          const [costs, addCost, updateCost, deleteCost] = useDatabase('costs', []);
          const [budgets, addBudget, updateBudget, deleteBudget] = useDatabase('budgets', []);
          const [logs, addLog, , ] = useDatabase('logs', []);
          const [stock, addStock, updateStock, deleteStock] = useDatabase('stock', []);
          
          const [webConfig, addConfig, updateConfig, ] = useDatabase('websiteConfig', [{id: 1, adsStatus: false, popupUrl: '', banners: [], ftpLink: ''}]);
          const [packages, addPackage, updatePackage, deletePackage] = useDatabase('packages', []);
          const [complaints, , , deleteComplaint] = useDatabase('complaints', []);
          const [reviews, , updateReview, deleteReview] = useDatabase('reviews', []);

          // Notification Logic (Red Dots)
          const todayISO = formatDateISO(new Date());
          const todayWebEn = new Date().toLocaleDateString('en-GB');
          const todayWebBn = new Date().toLocaleDateString('bn-BD');

          const hasNewAttendance = (attendances || []).some(a => a.date === todayISO);
          const hasNewLeave = (leaves || []).some(l => l.status === 'অপেক্ষমান');
          const hasNewExp = (expenses || []).some(e => e.status === 'অপেক্ষমান');
          const hasNewReport = (reports || []).some(r => r.date === todayISO);
          const hasNewIncome = (incomes || []).some(i => i.date === todayISO);
          const hasNewPayment = (payments || []).some(p => p.date === todayISO);
          const hasNewInvestment = (investments || []).some(i => i.date === todayISO);
          const hasNewWeb = (complaints || []).some(c => c.date === todayWebEn || c.date === todayWebBn) || 
                            (reviews || []).some(r => r.date === todayWebEn || r.date === todayWebBn);

          // Logs helper
          const logAction = (action) => {
            if (!currentUser) return;
            addLog({ id: Date.now(), userId: currentUser.id, userName: currentUser.name, action, timestamp: new Date().toISOString() });
          };

          const addAttendanceWithLog = (item) => { addAttendance(item); logAction(`Submitted attendance`); };
          const addLeaveWithLog = (item) => { addLeave(item); logAction(`Applied leave from ${item.startDate} to ${item.endDate}`); };
          const addExpenseWithLog = (item) => { addExpense(item); logAction(`Added expense of ৳${item.amount}`); };
          const addReportWithLog = (item) => { addReport(item); logAction(`Submitted daily report`); };
          const addSalaryWithLog = (item) => { addSalaryBase(item); logAction(`Added salary entry for ${item.userName}`); };
          const addPaymentWithLog = (item) => { addPaymentBase(item); logAction(`Recorded payment to ${item.userName}`); };
          const addInvestmentWithLog = (item) => { addInvestment(item); logAction(`Added investment of ৳${item.amount}`); };
          const addIncomeWithLog = (item) => { addIncome(item); logAction(`Added income of ৳${item.amount}`); };
          const addCostWithLog = (item) => { addCost(item); logAction(`Added cost of ৳${item.amount}`); };
          const addUserWithLog = (item) => { addUser(item); logAction(`Added new staff: ${item.name}`); };
          const addStockWithLog = (item) => { addStock(item); logAction(`Added stock: ${item.category}`); };
          const addBudgetWithLog = (item) => { addBudget(item); logAction(`Added budget for ${item.month}`); };

          useEffect(() => {
              if (currentUser && users) {
                  const updatedMe = users.find(u => u.id === currentUser.id);
                  if (updatedMe && JSON.stringify(updatedMe) !== JSON.stringify(currentUser)) {
                      setCurrentUser(updatedMe);
                  }
              }
          }, [users, currentUser]);

          useEffect(() => {
              if (currentUser?.role === 'admin' && logs) {
                  const threeMonthsAgo = new Date();
                  threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
                  const cutoff = threeMonthsAgo.toISOString();
                  logs.filter(l => l.timestamp < cutoff).forEach(l => {
                      db.collection('logs').doc(l.id.toString()).delete().catch(()=>{});
                  });
                  const newLogs = logs.filter(l => l.timestamp >= cutoff);
                  if (newLogs.length !== logs.length) {
                      window.localStorage.setItem('goti_logs', JSON.stringify(newLogs));
                  }
              }
          }, [logs, currentUser]);

          const handleLogin = (e) => {
            e.preventDefault();
            const loginId = e.target.loginId.value.trim();
            const password = e.target.password.value.trim();
            const user = (users || []).find(u => u.loginId === loginId && u.password === password);
            if (user) { 
                setCurrentUser(user); 
                setIsLoggedIn(true); 
                setCurrentView('dashboard'); 
                logAction('Logged in'); 
            } else { 
                showAlert('লগইন আইডি অথবা পাসওয়ার্ড ভুল হয়েছে!'); 
            }
          };

          const handleLogout = () => {
            showConfirm('আপনি কি লগআউট করতে চান?', () => {
              logAction('Logged out');
              setIsLoggedIn(false); 
              setCurrentUser(null);
            });
          };

          const updateUserProfile = (updatedUser) => {
            setCurrentUser(updatedUser);
            updateUser(updatedUser.id, { avatar: updatedUser.avatar });
            logAction('Updated profile picture');
          };

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-[#0f172a] flex flex-col items-center justify-center p-4">
                {dialog.open && <DialogBox dialog={dialog} setDialog={setDialog} />}
                
                <div className="mb-6 flex justify-center">
                   <img src="https://i.ibb.co.com/4Zy9b057/black-goti.png" alt="Logo" className="h-28 object-contain drop-shadow-2xl bg-white p-2 rounded-xl" />
                </div>
                
                <div className="max-w-md w-full bg-[#1e293b] border border-blue-900/50 rounded-2xl shadow-2xl p-8">
                  <div className="text-center mb-8">
                    <h1 className="text-3xl font-bold text-blue-400 mb-2">গতি এক্সপ্রেস</h1>
                    <p className="text-blue-200/60 text-sm">এডমিন ও স্টাফ প্যানেল</p>
                  </div>
                  
                  <form onSubmit={handleLogin} className="space-y-6">
                    <div>
                      <label className="block text-sm font-medium text-blue-200 mb-2 pl-1">লগইন আইডি</label>
                      <div className="relative">
                          <i className="fa-solid fa-user absolute left-4 top-3.5 text-slate-400"></i>
                          <input type="text" name="loginId" className="w-full pl-11 pr-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="ফোন বা ইমেইল" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-blue-200 mb-2 pl-1">পাসওয়ার্ড</label>
                      <div className="relative">
                          <i className="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                          <input type="password" name="password" className="w-full pl-11 pr-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="••••••••" />
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-blue-600 text-white py-3.5 rounded-xl hover:bg-blue-700 font-bold shadow-lg shadow-blue-900/50 mt-4 text-lg">
                        লগইন করুন
                    </button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="flex h-screen bg-[#f1f5f9] overflow-hidden">
              {dialog.open && <DialogBox dialog={dialog} setDialog={setDialog} />}
              
              {sidebarOpen && (
                  <div className="md:hidden fixed inset-0 bg-slate-900/60 z-40 backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div>
              )}

              {/* Sidebar */}
              <div className={`fixed inset-y-0 left-0 z-50 w-72 md:w-64 transform ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 transition-transform duration-300 ease-in-out bg-[#1e293b] flex flex-col shadow-2xl`}>
                <div className="p-4 bg-[#0f172a] flex items-center justify-between md:justify-center h-16 shrink-0 border-b border-slate-700">
                  <div className="flex items-center gap-3">
                      <img src="https://i.ibb.co.com/4Zy9b057/black-goti.png" alt="Logo" className="h-8 object-contain bg-white rounded p-1" />
                      <h2 className="text-xl font-bold text-blue-400 truncate">গতি এক্সপ্রেস</h2>
                  </div>
                  <button className="md:hidden text-slate-400 p-2" onClick={() => setSidebarOpen(false)}>
                      <i className="fa-solid fa-xmark text-xl"></i>
                  </button>
                </div>
                
                <div className="md:hidden p-4 border-b border-slate-700/50 bg-slate-800/30 flex items-center gap-3">
                    {currentUser.avatar ? (
                        <img src={currentUser.avatar} className="w-10 h-10 rounded-full border-2 border-blue-500 object-cover" />
                    ) : (
                        <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-white shadow-md">
                            {currentUser.name.charAt(0)}
                        </div>
                    )}
                    <div className="overflow-hidden">
                        <p className="text-white font-bold truncate">{currentUser.name}</p>
                        <p className="text-blue-300 text-xs truncate capitalize">{currentUser.role === 'admin' ? 'এডমিন' : 'স্টাফ'}</p>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto py-4">
                  <nav className="space-y-1.5 px-3">
                    <SidebarItem icon="fa-house" label="ড্যাশবোর্ড" active={currentView === 'dashboard'} onClick={() => {setCurrentView('dashboard'); setSidebarOpen(false);}} />
                    
                    {currentUser.role === 'admin' && (
                        <SidebarItem icon="fa-users" label="স্টাফ প্রোফাইল" active={currentView === 'employees'} onClick={() => {setCurrentView('employees'); setSidebarOpen(false);}} />
                    )}
                    
                    {(currentUser.role === 'admin' || currentUser.canSubmitAttendance) && (
                        <SidebarItem icon="fa-user-check" label="উপস্থিতি" active={currentView === 'attendance'} hasNew={currentUser.role === 'admin' && hasNewAttendance} onClick={() => {setCurrentView('attendance'); setSidebarOpen(false);}} />
                    )}
                    
                    <SidebarItem icon="fa-calendar-day" label="ছুটি" active={currentView === 'leave'} hasNew={currentUser.role === 'admin' && hasNewLeave} onClick={() => {setCurrentView('leave'); setSidebarOpen(false);}} />
                    
                    {(currentUser.role === 'admin' || currentUser.canSubmitExp || currentUser.canApproveExp || currentUser.canPayExp) && (
                        <SidebarItem icon="fa-money-bill-wave" label="যাতায়াত ও বিল" active={currentView === 'expenses'} hasNew={currentUser.role === 'admin' && hasNewExp} onClick={() => {setCurrentView('expenses'); setSidebarOpen(false);}} />
                    )}
                    
                    {(currentUser.role === 'admin' || currentUser.canSubmitIncome) && (
                        <SidebarItem icon="fa-money-bill-trend-up" label="আয়" active={currentView === 'incomes'} hasNew={currentUser.role === 'admin' && hasNewIncome} onClick={() => {setCurrentView('incomes'); setSidebarOpen(false);}} />
                    )}

                    {(currentUser.role === 'admin' || currentUser.canManageCosts) && (
                        <SidebarItem icon="fa-money-check-dollar" label="ব্যয়" active={currentView === 'costs'} onClick={() => {setCurrentView('costs'); setSidebarOpen(false);}} />
                    )}

                    {/* NEW BUDGET MENU ITEM */}
                    {(currentUser.role === 'admin' || currentUser.canManageBudget) && (
                        <SidebarItem icon="fa-chart-pie" label="বাজেট" active={currentView === 'budget'} onClick={() => {setCurrentView('budget'); setSidebarOpen(false);}} />
                    )}

                    {(currentUser.role === 'admin' || currentUser.canViewReports) && (
                        <SidebarItem icon="fa-file-lines" label="ডেইলি রিপোর্ট" active={currentView === 'reports'} hasNew={currentUser.role === 'admin' && hasNewReport} onClick={() => {setCurrentView('reports'); setSidebarOpen(false);}} />
                    )}
                    
                    <SidebarItem icon="fa-sack-dollar" label="বেতন" active={currentView === 'salary'} onClick={() => {setCurrentView('salary'); setSidebarOpen(false);}} />
                    
                    <SidebarItem icon="fa-wallet" label="পেমেন্ট" active={currentView === 'payments'} hasNew={currentUser.role === 'admin' && hasNewPayment} onClick={() => {setCurrentView('payments'); setSidebarOpen(false);}} />
                    
                    {(currentUser.role === 'admin' || currentUser.canInvest) && (
                        <SidebarItem icon="fa-chart-line" label="ইনভেস্টমেন্ট" active={currentView === 'investments'} hasNew={currentUser.role === 'admin' && hasNewInvestment} onClick={() => {setCurrentView('investments'); setSidebarOpen(false);}} />
                    )}
                    
                    {(currentUser.role === 'admin' || currentUser.canManageStock) && (
                        <SidebarItem icon="fa-boxes-stacked" label="স্টক ম্যানেজমেন্ট" active={currentView === 'stock'} onClick={() => {setCurrentView('stock'); setSidebarOpen(false);}} />
                    )}
                    
                    {(currentUser.role === 'admin' || currentUser.canManageBanners || currentUser.canManagePackages || currentUser.canManageComplaints || currentUser.canManageReviews || currentUser.canManageFTP) && (
                        <SidebarItem icon="fa-globe" label="ওয়েবসাইট কন্ট্রোল" active={currentView === 'website'} hasNew={currentUser.role === 'admin' && hasNewWeb} onClick={() => {setCurrentView('website'); setSidebarOpen(false);}} />
                    )}

                    {currentUser.role === 'admin' && (
                        <SidebarItem icon="fa-clipboard-list" label="লগ" active={currentView === 'logs'} onClick={() => {setCurrentView('logs'); setSidebarOpen(false);}} />
                    )}
                  </nav>
                </div>
                
                <div className="p-4 border-t border-slate-700 bg-[#0f172a]/50">
                   <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-red-500/10 text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-colors font-semibold">
                       <i className="fa-solid fa-power-off"></i> লগআউট
                   </button>
                </div>
              </div>

              {/* Main Content Area */}
              <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                
                <header className="hidden md:flex h-16 bg-[#0f172a] text-white items-center justify-between px-6 shrink-0 shadow-md z-10">
                  <div className="flex items-center space-x-2 text-sm text-blue-300">
                      <i className="fa-solid fa-house text-xs"></i> <span>›</span> 
                      <span className="text-blue-100 font-medium capitalize">
                          {currentView === 'employees' ? 'স্টাফ প্রোফাইল' : currentView === 'attendance' ? 'উপস্থিতি' : currentView === 'leave' ? 'ছুটি' : currentView === 'expenses' ? 'যাতায়াত ও অন্যান্য বিল' : currentView === 'incomes' ? 'আয়' : currentView === 'costs' ? 'ব্যয়' : currentView === 'budget' ? 'বাজেট' : currentView === 'reports' ? 'ডেইলি রিপোর্ট' : currentView === 'salary' ? 'বেতন' : currentView === 'payments' ? 'পেমেন্ট' : currentView === 'investments' ? 'ইনভেস্টমেন্ট' : currentView === 'stock' ? 'স্টক ম্যানেজমেন্ট' : currentView === 'website' ? 'ওয়েবসাইট কন্ট্রোল' : currentView === 'logs' ? 'লগ' : 'ড্যাশবোর্ড'}
                      </span>
                  </div>
                  <div className="flex items-center space-x-5">
                    <div className="flex items-center space-x-3 pl-5">
                      <div className="text-right">
                          <p className="text-sm font-medium text-blue-50 leading-tight">{currentUser.name}</p>
                          <p className="text-xs text-blue-400 capitalize">{currentUser.role === 'admin' ? 'এডমিন' : 'স্টাফ'}</p>
                      </div>
                      {currentUser.avatar ? (
                          <img src={currentUser.avatar} className="w-9 h-9 rounded-full border-2 border-blue-500 object-cover" /> 
                      ) : (
                          <div className="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center font-bold text-sm shadow">
                              {currentUser.name.charAt(0)}
                          </div>
                      )}
                    </div>
                  </div>
                </header>

                <header className="md:hidden h-14 bg-[#0f172a] text-white flex items-center justify-between px-4 shrink-0 shadow-md z-10">
                  <div className="flex items-center gap-2">
                      <img src="https://i.ibb.co.com/4Zy9b057/black-goti.png" alt="Logo" className="h-6 object-contain bg-white rounded px-1" />
                      <span className="font-bold text-blue-100 capitalize">
                          {currentView === 'employees' ? 'স্টাফ' : currentView === 'attendance' ? 'উপস্থিতি' : currentView === 'leave' ? 'ছুটি' : currentView === 'expenses' ? 'বিল' : currentView === 'incomes' ? 'আয়' : currentView === 'costs' ? 'ব্যয়' : currentView === 'budget' ? 'বাজেট' : currentView === 'reports' ? 'রিপোর্ট' : currentView === 'salary' ? 'বেতন' : currentView === 'payments' ? 'পেমেন্ট' : currentView === 'investments' ? 'ইনভেস্টমেন্ট' : currentView === 'stock' ? 'স্টক' : currentView === 'website' ? 'ওয়েবসাইট কন্ট্রোল' : currentView === 'logs' ? 'লগ' : 'ড্যাশবোর্ড'}
                      </span>
                  </div>
                </header>

                <main className="flex-1 overflow-x-hidden overflow-y-auto bg-[#e2e8f0] p-4 pb-24 md:pb-6 sm:p-6 lg:p-8">
                  <div className="max-w-7xl mx-auto">
                    {}
                    {currentView === 'dashboard' && <DashboardView user={currentUser} updateUser={updateUserProfile} incomes={incomes} costs={costs} budgets={budgets} />}
                    
                    {currentView === 'attendance' && (currentUser.role === 'admin' || currentUser.canSubmitAttendance) && (
                        <AttendanceView user={currentUser} attendances={attendances} addAttendance={addAttendanceWithLog} users={users} showAlert={showAlert} logAction={logAction} />
                    )}
                    
                    {currentView === 'leave' && <LeaveView user={currentUser} leaves={leaves} addLeave={addLeaveWithLog} updateLeave={updateLeave} deleteLeave={deleteLeave} showConfirm={showConfirm} logAction={logAction} />}
                    
                    {currentView === 'expenses' && (currentUser.role === 'admin' || currentUser.canSubmitExp || currentUser.canApproveExp || currentUser.canPayExp) && (
                        <ExpenseView user={currentUser} expenses={expenses} addExpense={addExpenseWithLog} updateExpense={updateExpense} deleteExpense={deleteExpense} showConfirm={showConfirm} showPrompt={showPrompt} showAlert={showAlert} logAction={logAction} />
                    )}
                    
                    {currentView === 'incomes' && (currentUser.role === 'admin' || currentUser.canSubmitIncome) && (
                        <IncomeView user={currentUser} incomes={incomes} addIncome={addIncomeWithLog} updateIncome={updateIncome} deleteIncome={deleteIncome} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}

                    {currentView === 'costs' && (currentUser.role === 'admin' || currentUser.canManageCosts) && (
                        <CostView user={currentUser} costs={costs} addCost={addCostWithLog} updateCost={updateCost} deleteCost={deleteCost} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}

                    {/* NEW BUDGET VIEW */}
                    {currentView === 'budget' && (currentUser.role === 'admin' || currentUser.canManageBudget) && (
                        <BudgetView user={currentUser} budgets={budgets} addBudget={addBudgetWithLog} updateBudget={updateBudget} deleteBudget={deleteBudget} expenses={expenses} costs={costs} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}

                    {currentView === 'reports' && (currentUser.role === 'admin' || currentUser.canViewReports) && (
                        <ReportView user={currentUser} reports={reports} addReport={addReportWithLog} deleteReport={deleteReport} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}
                    
                    {currentView === 'salary' && <SalaryView user={currentUser} users={users} salaries={salaries} addSalary={addSalaryWithLog} updateSalary={updateSalary} deleteSalary={deleteSalary} salaryHistories={salaryHistories} addSalaryHistory={addSalaryHistory} deleteSalaryHistory={deleteSalaryHistory} resellerBills={resellerBills} addResellerBill={addResellerBill} updateResellerBill={updateResellerBill} deleteResellerBill={deleteResellerBill} updateUser={updateUser} showAlert={showAlert} showConfirm={showConfirm} logAction={logAction} />}
                    
                    {currentView === 'employees' && currentUser.role === 'admin' && (
                        <EmployeesView users={users} addUser={addUserWithLog} updateUser={updateUser} deleteUser={deleteUser} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}
                    
                    {currentView === 'payments' && <PaymentsView user={currentUser} payments={payments} addPayment={addPaymentWithLog} deletePayment={deletePayment} users={users} expenses={expenses} showAlert={showAlert} showConfirm={showConfirm} logAction={logAction} />}
                    
                    {currentView === 'investments' && (currentUser.role === 'admin' || currentUser.canInvest) && (
                        <InvestView user={currentUser} investments={investments} addInvestment={addInvestmentWithLog} updateInvestment={updateInvestment} deleteInvestment={deleteInvestment} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}
                    
                    {currentView === 'stock' && (currentUser.role === 'admin' || currentUser.canManageStock) && (
                        <StockView user={currentUser} stock={stock} addStock={addStockWithLog} updateStock={updateStock} deleteStock={deleteStock} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />
                    )}
                    
                    {currentView === 'website' && (currentUser.role === 'admin' || currentUser.canManageBanners || currentUser.canManagePackages || currentUser.canManageComplaints || currentUser.canManageReviews || currentUser.canManageFTP) && (
                        <WebsiteSettingsView user={currentUser} config={webConfig[0] || {id: 1, adsStatus: false, popupUrl: '', banners: [], ftpLink: ''}} updateConfig={updateConfig} packages={packages} addPackage={addPackage} updatePackage={updatePackage} deletePackage={deletePackage} complaints={complaints} deleteComplaint={deleteComplaint} reviews={reviews} updateReview={updateReview} deleteReview={deleteReview} showAlert={showAlert} showConfirm={showConfirm} logAction={logAction} />
                    )}

                    {currentView === 'logs' && currentUser.role === 'admin' && <LogsView logs={logs} />}
                  </div>
                </main>

                <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 pb-safe pt-1 flex justify-around items-center h-[68px] z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] rounded-t-2xl">
                  <BottomNavItem icon="fa-house" label="ড্যাশবোর্ড" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                  
                  {(currentUser.role === 'admin' || currentUser.canSubmitAttendance) && (
                    <BottomNavItem icon="fa-user-check" label="উপস্থিতি" active={currentView === 'attendance'} hasNew={currentUser.role==='admin' && hasNewAttendance} onClick={() => setCurrentView('attendance')} />
                  )}
                  
                  <div className="relative -top-5">
                    <button onClick={() => setCurrentView((currentUser.role === 'admin' || currentUser.canSubmitIncome) ? 'incomes' : 'expenses')} className="w-14 h-14 bg-gradient-to-r from-[#2d1960] to-[#5e3186] rounded-full flex flex-col items-center justify-center text-white shadow-lg shadow-purple-500/40 border-4 border-[#e2e8f0] active:scale-95 transition-transform">
                        <i className={`fa-solid ${(currentUser.role === 'admin' || currentUser.canSubmitIncome) ? 'fa-money-bill-trend-up' : 'fa-money-bill-wave'} text-xl`}></i>
                    </button>
                    {currentUser.role === 'admin' && hasNewIncome && (
                        <span className="absolute right-0 top-0 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
                    )}
                  </div>
                  
                  <BottomNavItem icon="fa-sack-dollar" label="বেতন" active={currentView === 'salary'} onClick={() => setCurrentView('salary')} />
                  <BottomNavItem icon="fa-bars" label="মেনু" active={sidebarOpen} onClick={() => setSidebarOpen(true)} />
                </nav>
              </div>
            </div>
          );
        }

        function DialogBox({ dialog, setDialog }) {
          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-fade-in-up text-center">
                  <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 ${dialog.type === 'alert' ? 'bg-red-100 text-red-500' : dialog.type === 'confirm' ? 'bg-orange-100 text-orange-500' : 'bg-blue-100 text-blue-500'}`}>
                      <i className={`fa-solid text-3xl ${dialog.type === 'alert' ? 'fa-triangle-exclamation' : dialog.type === 'confirm' ? 'fa-question' : 'fa-info'}`}></i>
                  </div>
                  <h3 className="text-lg font-bold text-slate-800 mb-4">{dialog.msg}</h3>
                  {dialog.type === 'prompt' && (
                      <input type="text" autoFocus value={dialog.inputVal} onChange={e => setDialog({...dialog, inputVal: e.target.value})} className="w-full border border-slate-300 p-3 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="এখানে লিখুন..." />
                  )}
                  <div className="flex justify-center gap-3 mt-4">
                      {dialog.type === 'confirm' && (
                          <button onClick={() => setDialog({open: false})} className="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">বাতিল</button>
                      )}
                      <button onClick={() => { dialog.action && dialog.action(dialog.inputVal); setDialog({open: false}); }} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">
                          ঠিক আছে
                      </button>
                  </div>
              </div>
            </div>
          );
        }

        function SidebarItem({ icon, label, active, onClick, hasNew }) {
          return (
            <button onClick={onClick} className={`relative w-full flex items-center px-4 py-3.5 mb-1.5 text-sm rounded-xl transition-all duration-200 font-bold ${active ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
              <i className={`fa-solid ${icon} w-6 text-center mr-3 text-lg ${active ? 'text-white' : 'text-blue-400'}`}></i> {label}
              {hasNew && (
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-pulse"></span>
              )}
            </button>
          );
        }

        function BottomNavItem({ icon, label, active, onClick, hasNew }) {
          return (
            <button onClick={onClick} className={`relative flex flex-col items-center justify-center w-16 h-full transition-colors ${active ? 'text-blue-600' : 'text-slate-400'}`}>
              <i className={`fa-solid ${icon} text-xl mb-1 ${active ? 'animate-bounce-short' : ''}`}></i>
              <span className={`text-[10px] font-semibold tracking-wide ${active ? 'font-bold' : ''}`}>{label}</span>
              {hasNew && (
                  <span className="absolute right-4 top-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
              )}
            </button>
          );
        }

        function DashboardView({ user, updateUser, incomes, costs, budgets }) {
          const handleAvatarUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => updateUser({ ...user, avatar: reader.result });
              reader.readAsDataURL(file);
            }
          };

          const now = new Date();
          const currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

          const monthIncomes = (incomes || []).filter(i => i.date && i.date.startsWith(currentMonth));
          const monthCosts = (costs || []).filter(c => c.date && c.date.startsWith(currentMonth));

          const totalIncome = monthIncomes.reduce((sum, i) => sum + (Number(i.amount) || 0), 0);
          const totalCost = monthCosts.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
          const netCash = totalIncome - totalCost;

          const canViewBalance = user.role === 'admin' || user.canViewBalance;
          
          // Basic budget overview for dashboard
          const currentBudget = (budgets || []).find(b => b.month === currentMonth);
          const totalBudgetAllocated = currentBudget ? Object.values(currentBudget.allocations || {}).reduce((a, b) => a + Number(b), 0) : 0;
          const budgetPercentage = totalBudgetAllocated > 0 ? Math.min(100, Math.round((totalCost / totalBudgetAllocated) * 100)) : 0;

          return (
            <div className="space-y-6">
              {/* Profile Card */}
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col relative group">
                <div className="bg-gradient-to-r from-[#1e293b] to-[#0f172a] h-24 md:h-32 relative flex justify-center">
                   <div className="absolute -bottom-10 md:-bottom-12 w-24 h-24 md:w-28 md:h-28 bg-white rounded-2xl md:rounded-xl border-4 border-white overflow-hidden flex items-center justify-center shadow-lg group">
                      {user.avatar ? (
                          <img src={user.avatar} alt="Profile" className="w-full h-full object-cover" />
                      ) : (
                          <img src={`https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=1e293b&color=fff&size=120`} alt="Profile" />
                      )}
                      <label className="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center cursor-pointer text-white flex-col transition-all">
                          <i className="fa-solid fa-camera text-xl"></i>
                          <input type="file" accept="image/*" onChange={handleAvatarUpload} className="hidden" />
                      </label>
                   </div>
                </div>
                <div className="pt-14 md:pt-16 pb-5 md:pb-6 text-center border-b border-slate-100 px-4">
                  <h3 className="text-xl md:text-2xl font-bold text-slate-800">{user.name}</h3>
                  <p className="text-sm text-slate-500 mt-0.5">{user.loginId}</p>
                </div>
                <div className="p-4 md:p-5 flex-1 bg-slate-50/50">
                  <div className="grid grid-cols-2 gap-3 text-sm">
                    <div className="flex flex-col text-slate-700 bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm items-center text-center">
                        <i className="fa-solid fa-briefcase text-blue-500 mb-2 text-lg"></i>
                        <p className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">পদবী</p>
                        <p className="font-bold text-xs md:text-sm">{user.designation}</p>
                    </div>
                    <div className="flex flex-col text-slate-700 bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm items-center text-center">
                        <i className="fa-solid fa-shield-halved text-blue-500 mb-2 text-lg"></i>
                        <p className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">রোল</p>
                        <p className="font-bold text-xs md:text-sm capitalize">{user.role === 'admin' ? 'এডমিন' : 'স্টাফ'}</p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Budget Overview Widget */}
              {(user.role === 'admin' || user.canManageBudget) && currentBudget && (
                 <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 md:p-6">
                     <h3 className="text-sm font-bold text-slate-600 uppercase mb-3 flex items-center gap-2">
                         <i className="fa-solid fa-chart-pie text-purple-500"></i> চলতি মাসের বাজেট স্ট্যাটাস
                     </h3>
                     <div className="flex justify-between items-end mb-2">
                         <div>
                             <p className="text-2xl font-black text-slate-800">৳{totalCost.toLocaleString()}</p>
                             <p className="text-xs font-bold text-slate-400">খরচ হয়েছে</p>
                         </div>
                         <div className="text-right">
                             <p className="text-lg font-bold text-slate-600">৳{totalBudgetAllocated.toLocaleString()}</p>
                             <p className="text-xs font-bold text-slate-400">বাজেট</p>
                         </div>
                     </div>
                     <div className="w-full bg-slate-100 rounded-full h-3 mb-2 overflow-hidden">
                         <div className={`h-3 rounded-full ${budgetPercentage > 100 ? 'bg-red-500' : budgetPercentage > 80 ? 'bg-orange-500' : 'bg-purple-500'}`} style={{ width: `${Math.min(budgetPercentage, 100)}%` }}></div>
                     </div>
                     <p className={`text-xs font-bold text-right ${budgetPercentage > 100 ? 'text-red-500' : 'text-slate-500'}`}>
                         {budgetPercentage}% ব্যবহৃত {budgetPercentage > 100 && '(বাজেট ওভার)'}
                     </p>
                 </div>
              )}

              {/* Cash Balance Card (Access Controlled) */}
              {canViewBalance && (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 md:p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                      <i className="fa-solid fa-coins text-green-500"></i> মাসিক ক্যাশ ব্যালেন্স
                    </h3>
                    <span className="text-xs bg-slate-100 px-2 py-1 rounded-full text-slate-600 font-medium">বর্তমান মাস</span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="bg-green-50 border border-green-200 p-4 rounded-xl text-center relative overflow-hidden">
                      <div className="absolute top-0 right-0 p-2 text-green-300"><i className="fa-solid fa-circle-dollar-to-slot text-4xl opacity-30"></i></div>
                      <p className="text-[10px] md:text-xs text-green-700 font-bold uppercase">মোট আয়</p>
                      <p className="text-xl md:text-2xl font-black text-green-700">৳{totalIncome.toLocaleString()}</p>
                    </div>
                    <div className="bg-red-50 border border-red-200 p-4 rounded-xl text-center relative overflow-hidden">
                      <div className="absolute top-0 right-0 p-2 text-red-300"><i className="fa-solid fa-money-bill-wave text-4xl opacity-30"></i></div>
                      <p className="text-[10px] md:text-xs text-red-700 font-bold uppercase">মোট ব্যয়</p>
                      <p className="text-xl md:text-2xl font-black text-red-700">৳{totalCost.toLocaleString()}</p>
                    </div>
                    <div className={`p-4 rounded-xl text-center relative overflow-hidden ${netCash >= 0 ? 'bg-blue-50 border-blue-200' : 'bg-orange-50 border-orange-200'}`}>
                      <div className={`absolute top-0 right-0 p-2 ${netCash >= 0 ? 'text-blue-300' : 'text-orange-300'}`}>
                        <i className={`fa-solid ${netCash >= 0 ? 'fa-circle-check' : 'fa-circle-exclamation'} text-4xl opacity-30`}></i>
                      </div>
                      <p className="text-[10px] md:text-xs font-bold uppercase">নেট ক্যাশ</p>
                      <p className={`text-xl md:text-2xl font-black ${netCash >= 0 ? 'text-blue-700' : 'text-orange-700'}`}>
                        {netCash >= 0 ? '+' : ''}৳{netCash.toLocaleString()}
                      </p>
                    </div>
                  </div>
                  <div className="mt-3 text-xs text-slate-500 text-center border-t border-slate-100 pt-3">
                    <i className="fa-solid fa-circle-info mr-1"></i> নেট ক্যাশ = মোট আয় (বর্তমান মাস) − মোট ব্যয় (বর্তমান মাস)
                  </div>
                </div>
              )}

              {/* Clocks & Calendar */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
                    <div className="bg-blue-600 text-white p-3 text-center font-bold text-lg md:text-xl">
                        <RealTimeClock />
                    </div>
                    <div className="flex-1 flex items-center justify-center p-6 bg-slate-50">
                        <AnalogClock />
                    </div>
                </div>
                <div className="bg-[#1e293b] text-white rounded-2xl shadow-lg p-5 md:p-6 border border-slate-700 overflow-hidden">
                    <MiniCalendar />
                </div>
              </div>
            </div>
          );
        }

        function BudgetView({ user, budgets, addBudget, updateBudget, deleteBudget, expenses, costs, showConfirm, showAlert, logAction }) {
            const [viewMode, setViewMode] = useState('dashboard'); // 'dashboard', 'entry'
            const [selectedMonth, setSelectedMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
            });

            // Standard budget categories based on requirements
            const budgetCategories = [
                { id: 'kisti', label: 'কিস্তি' },
                { id: 'bandwidth', label: 'ব্যান্ডউইথ বিল' },
                { id: 'electricity', label: 'বিদ্যুৎ বিল' },
                { id: 'reseller', label: 'রিসেলার বিল' },
                { id: 'staff_salary', label: 'স্টাফ বেতন' },
                { id: 'joint_splicing', label: 'জয়েন্ট স্প্লেসিং খরচ' },
                { id: 'office', label: 'অফিস খরচ' },
                { id: 'others', label: 'অন্যান্য' }
            ];

            const [allocations, setAllocations] = useState({});

            // Load existing budget for edit mode
            useEffect(() => {
                const existing = (budgets || []).find(b => b.month === selectedMonth);
                if (existing) {
                    setAllocations(existing.allocations || {});
                } else {
                    setAllocations({});
                }
            }, [selectedMonth, budgets]);

            const handleAllocationChange = (catId, value) => {
                setAllocations(prev => ({...prev, [catId]: value}));
            };

            const submitBudget = (e) => {
                e.preventDefault();
                const existing = (budgets || []).find(b => b.month === selectedMonth);
                
                // Clean allocations (ensure numbers)
                const cleanAllocations = {};
                Object.keys(allocations).forEach(k => {
                    cleanAllocations[k] = parseFloat(allocations[k]) || 0;
                });

                if (existing) {
                    updateBudget(existing.id, { allocations: cleanAllocations, updatedAt: getCurrentTimeStr() });
                    logAction(`Updated budget for ${selectedMonth}`);
                    showAlert('বাজেট আপডেট করা হয়েছে!');
                } else {
                    addBudget({
                        id: Date.now(),
                        month: selectedMonth,
                        allocations: cleanAllocations,
                        createdAt: getCurrentTimeStr()
                    });
                    logAction(`Created budget for ${selectedMonth}`);
                    showAlert('বাজেট সংরক্ষণ করা হয়েছে!');
                }
                setViewMode('dashboard');
            };

            // Calculate actual spent amounts for the selected month
            // We combine relevant data from expenses, costs, and potentially salaries if needed
            const getActualSpent = (month) => {
                const spent = {};
                budgetCategories.forEach(cat => spent[cat.id] = 0);

                // Expenses (Staff Bills)
                const monthExpenses = (expenses || []).filter(e => e.date && e.date.startsWith(month) && e.status === 'পেইড');
                monthExpenses.forEach(e => {
                    const amt = Number(e.amount) || 0;
                    if(e.category === 'বিদ্যুৎ বিল') spent['electricity'] += amt;
                    else if(e.category === 'অফিস বাবদ') spent['office'] += amt;
                    else if(e.category === 'স্টাফ বাবদ') spent['staff_salary'] += amt;
                    else spent['others'] += amt; // যাতায়াত etc fall to others unless specified
                });

                // Costs (Company Costs)
                const monthCosts = (costs || []).filter(c => c.date && c.date.startsWith(month));
                monthCosts.forEach(c => {
                    const amt = Number(c.amount) || 0;
                    if(c.category === 'ব্যান্ডউইথ') spent['bandwidth'] += amt;
                    else if(c.category === 'বিদ্যুৎ বিল') spent['electricity'] += amt;
                    else if(c.category === 'অফিস বাবদ') spent['office'] += amt;
                    else if(c.category === 'স্টাফ বাবদ') spent['staff_salary'] += amt;
                    else if(c.category === 'জয়েন্ট/স্প্লেসিং খরচ') spent['joint_splicing'] += amt;
                    else spent['others'] += amt;
                });

                return spent;
            };

            const actualSpent = getActualSpent(selectedMonth);
            const currentBudget = (budgets || []).find(b => b.month === selectedMonth) || { allocations: {} };

            return (
                <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-4 gap-4">
                        <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center gap-2">
                            <i className="fa-solid fa-chart-pie text-purple-600"></i> বাজেট ম্যানেজমেন্ট
                        </h2>
                        
                        <div className="flex gap-2">
                            {user.role === 'admin' && (
                                <div className="flex bg-slate-100 rounded-lg p-1 mr-2">
                                    <button onClick={() => setViewMode('dashboard')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'dashboard' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>ড্যাশবোর্ড</button>
                                    <button onClick={() => setViewMode('entry')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'entry' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>এন্ট্রি/এডিট</button>
                                </div>
                            )}
                            <div className="flex items-center gap-2 bg-purple-50 px-3 py-1.5 rounded-lg border border-purple-200">
                                <label className="text-xs font-bold text-purple-800">মাস:</label>
                                <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-transparent text-sm font-bold text-purple-700 outline-none cursor-pointer" />
                            </div>
                        </div>
                    </div>

                    {viewMode === 'dashboard' ? (
                        <div className="animate-fade-in-up">
                            {(!budgets || budgets.length === 0 || !budgets.find(b => b.month === selectedMonth)) ? (
                                <div className="p-10 text-center bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                                    <i className="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                                    <p className="text-slate-500 font-medium">এই মাসের জন্য কোনো বাজেট সেট করা হয়নি।</p>
                                    {user.role === 'admin' && (
                                        <button onClick={() => setViewMode('entry')} className="mt-4 bg-purple-600 text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-purple-700 transition">নতুন বাজেট তৈরি করুন</button>
                                    )}
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    {/* Summary Cards */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-purple-50 p-5 rounded-2xl border border-purple-100 relative overflow-hidden">
                                            <i className="fa-solid fa-bullseye absolute right-4 top-1/2 -translate-y-1/2 text-purple-500/10 text-6xl"></i>
                                            <p className="text-xs font-bold text-purple-800 uppercase mb-1">মোট বাজেট</p>
                                            <p className="text-3xl font-black text-purple-700">৳{Object.values(currentBudget.allocations || {}).reduce((a,b)=>a+(Number(b)||0), 0).toLocaleString()}</p>
                                        </div>
                                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 relative overflow-hidden">
                                            <i className="fa-solid fa-money-bill-wave absolute right-4 top-1/2 -translate-y-1/2 text-blue-500/10 text-6xl"></i>
                                            <p className="text-xs font-bold text-blue-800 uppercase mb-1">মোট খরচ হয়েছে</p>
                                            <p className="text-3xl font-black text-blue-700">৳{Object.values(actualSpent).reduce((a,b)=>a+(Number(b)||0), 0).toLocaleString()}</p>
                                        </div>
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 relative overflow-hidden">
                                            <i className="fa-solid fa-scale-balanced absolute right-4 top-1/2 -translate-y-1/2 text-slate-500/10 text-6xl"></i>
                                            <p className="text-xs font-bold text-slate-600 uppercase mb-1">অবশিষ্ট বাজেট</p>
                                            <p className="text-3xl font-black text-slate-700">৳{(Object.values(currentBudget.allocations || {}).reduce((a,b)=>a+(Number(b)||0), 0) - Object.values(actualSpent).reduce((a,b)=>a+(Number(b)||0), 0)).toLocaleString()}</p>
                                        </div>
                                    </div>

                                    {/* Detailed Budget Breakdown */}
                                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                                        <div className="bg-slate-50 p-4 border-b border-slate-200">
                                            <h3 className="font-bold text-slate-800">খাতভিত্তিক বাজেট রিপোর্ট</h3>
                                        </div>
                                        <div className="divide-y divide-slate-100">
                                            {budgetCategories.map(cat => {
                                                const allocated = Number(currentBudget.allocations[cat.id]) || 0;
                                                const spent = Number(actualSpent[cat.id]) || 0;
                                                const remaining = allocated - spent;
                                                const percentUsed = allocated > 0 ? Math.round((spent / allocated) * 100) : (spent > 0 ? 100 : 0);
                                                const isOver = spent > allocated;

                                                return (
                                                    <div key={cat.id} className="p-4 hover:bg-slate-50 transition">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <span className="font-bold text-slate-700">{cat.label}</span>
                                                            <div className="text-right">
                                                                <span className="text-xs text-slate-500 font-bold mr-3">বাজেট: ৳{allocated.toLocaleString()}</span>
                                                                <span className={`text-sm font-black ${isOver ? 'text-red-600' : 'text-blue-600'}`}>খরচ: ৳{spent.toLocaleString()}</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <div className="flex-1 bg-slate-200 rounded-full h-2.5 overflow-hidden">
                                                                <div className={`h-full rounded-full ${isOver ? 'bg-red-500' : percentUsed > 80 ? 'bg-orange-400' : 'bg-green-500'}`} style={{ width: `${Math.min(percentUsed, 100)}%` }}></div>
                                                            </div>
                                                            <span className={`text-xs font-bold w-12 text-right ${isOver ? 'text-red-600' : 'text-slate-600'}`}>{percentUsed}%</span>
                                                        </div>
                                                        {isOver && <p className="text-[10px] text-red-500 font-bold mt-1 text-right"><i className="fa-solid fa-triangle-exclamation mr-1"></i>বাজেট ওভার (৳{Math.abs(remaining).toLocaleString()})</p>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="animate-fade-in-up">
                            <form onSubmit={submitBudget} className="bg-purple-50/30 border border-purple-100 rounded-2xl p-5 md:p-8">
                                <h3 className="font-bold text-slate-800 mb-6 text-lg border-b border-purple-200 pb-2">খাতভিত্তিক বাজেট এন্ট্রি ({selectedMonth})</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                                    {budgetCategories.map(cat => (
                                        <div key={cat.id} className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                            <label className="font-bold text-slate-700 text-sm flex-1">{cat.label}</label>
                                            <div className="relative w-1/2">
                                                <span className="absolute left-3 top-2.5 text-slate-400 font-bold text-sm">৳</span>
                                                <input 
                                                    type="number" 
                                                    value={allocations[cat.id] || ''} 
                                                    onChange={e => handleAllocationChange(cat.id, e.target.value)}
                                                    className="w-full pl-7 pr-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-purple-500 font-bold text-purple-700"
                                                    placeholder="0"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-8 flex justify-end gap-3 pt-4 border-t border-purple-200">
                                    <button type="button" onClick={() => setViewMode('dashboard')} className="px-6 py-3 rounded-xl font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 transition">বাতিল</button>
                                    <button type="submit" className="px-8 py-3 rounded-xl font-bold bg-purple-600 text-white shadow-lg hover:bg-purple-700 active:scale-95 transition"><i className="fa-solid fa-save mr-2"></i>বাজেট সেভ করুন</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function SalaryView({ user, users, salaries, addSalary, updateSalary, deleteSalary, salaryHistories, addSalaryHistory, deleteSalaryHistory, resellerBills, addResellerBill, updateResellerBill, deleteResellerBill, updateUser, showAlert, showConfirm, logAction }) {
           const [activeTab, setActiveTab] = useState('staff'); // 'staff', 'reseller'
           
           // Staff Salary State
           const [editingSalId, setEditingSalId] = useState(null);
           const [empId, setEmpId] = useState(''); 
           const [month, setMonth] = useState(''); 
           const [baseSalary, setBaseSalary] = useState('');
           const [status, setStatus] = useState('পেন্ডিং');
           
           // History Entry State
           const [histDate, setHistDate] = useState(() => formatDateISO(new Date()));
           const [histType, setHistType] = useState('advance'); // 'advance', 'deduction'
           const [histAmount, setHistAmount] = useState('');
           const [histReason, setHistReason] = useState('');
           
           // Reseller State
           const [resellerName, setResellerName] = useState('');
           const [resellerId, setResellerId] = useState('');
           const [resellerBillAmt, setResellerBillAmt] = useState('');
           const [resellerCommissionInput, setResellerCommissionInput] = useState('');
           const [selectedResellerUser, setSelectedResellerUser] = useState('');

           const submitSalaryConfig = (e) => {
              e.preventDefault();
              const emp = (users || []).find(u => u.id.toString() === empId);
              if(!emp) return;

              if (editingSalId) {
                  updateSalary(editingSalId, { 
                      userId: emp.id, 
                      userName: emp.name, 
                      month, 
                      baseSalary: parseFloat(baseSalary)||0, 
                      status 
                  });
                  logAction(`Updated salary config for ${emp.name} ${month}`);
                  setEditingSalId(null);
                  showAlert('বেতন কনফিগারেশন আপডেট করা হয়েছে!');
              } else {
                  // Check if already exists
                  const exists = (salaries || []).find(s => s.userId === emp.id && s.month === month);
                  if(exists) {
                      showAlert('এই স্টাফের জন্য এই মাসের বেতন কনফিগারেশন ইতমধ্যে আছে।');
                      return;
                  }

                  addSalary({ 
                      id: Date.now(), 
                      userId: emp.id, 
                      userName: emp.name, 
                      month: month, 
                      baseSalary: parseFloat(baseSalary)||0, 
                      status: status
                  });
                  logAction(`Added salary config for ${emp.name} ${month}`);
                  showAlert('বেতন কনফিগারেশন সেভ করা হয়েছে!');
              }
              setEmpId(''); setMonth(''); setBaseSalary(''); setStatus('পেন্ডিং');
           };

           const submitSalaryHistory = (e, salId) => {
               e.preventDefault();
               if(!histAmount || !histReason) return;

               addSalaryHistory({
                   id: Date.now(),
                   salaryId: salId,
                   date: histDate,
                   type: histType,
                   amount: parseFloat(histAmount),
                   reason: histReason
               });
               logAction(`Added ${histType} to salary ${salId}`);
               setHistAmount(''); setHistReason(''); setHistDate(formatDateISO(new Date()));
               showAlert('রেকর্ড যুক্ত হয়েছে!');
           };

           const cancelEditConfig = () => {
              setEditingSalId(null); setEmpId(''); setMonth(''); setBaseSalary(''); setStatus('পেন্ডিং');
           };

           const displaySalaries = user.role === 'admin' ? (salaries || []) : (salaries || []).filter(s => s.userId === user.id);

           // Derived calculations for net salary
           const getCalculatedSalary = (sal) => {
               const hists = (salaryHistories || []).filter(h => h.salaryId === sal.id);
               const advances = hists.filter(h => h.type === 'advance').reduce((sum, h) => sum + Number(h.amount), 0);
               const deductions = hists.filter(h => h.type === 'deduction').reduce((sum, h) => sum + Number(h.amount), 0);
               const net = (Number(sal.baseSalary) || 0) - advances - deductions;
               return { ...sal, advances, deductions, net, histories: hists };
           };

           // --- Reseller Functions ---
           const submitResellerBill = (e) => {
               e.preventDefault();
               if(user.role !== 'staff' && user.role !== 'admin') return; // Ensure valid role
               
               const rUser = user.role === 'admin' ? (users||[]).find(u=>u.id.toString() === selectedResellerUser) : user;
               if(!rUser) return;

               addResellerBill({
                   id: Date.now(),
                   userId: rUser.id,
                   userName: rUser.name,
                   customerName: resellerName,
                   customerId: resellerId,
                   billAmount: parseFloat(resellerBillAmt),
                   date: formatDateISO(new Date()),
                   month: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`,
                   commissionPercent: rUser.resellerCommission || 0
               });
               logAction(`Added reseller bill for ${resellerName}`);
               setResellerName(''); setResellerId(''); setResellerBillAmt('');
               showAlert('কাস্টমার বিল এন্ট্রি হয়েছে!');
           };

           const updateResellerCommission = (userId, percent) => {
               updateUser(userId, { resellerCommission: parseFloat(percent) || 0 });
               showAlert('কমিশন সেট করা হয়েছে!');
           };

           const displayResellerBills = user.role === 'admin' ? (resellerBills || []) : (resellerBills || []).filter(b => b.userId === user.id);
           
           // Group reseller bills by user and month for summary
           const resellerSummary = {};
           displayResellerBills.forEach(bill => {
               const key = `${bill.userId}_${bill.month}`;
               if(!resellerSummary[key]) {
                   resellerSummary[key] = {
                       userId: bill.userId,
                       userName: bill.userName,
                       month: bill.month,
                       totalBill: 0,
                       commissionEarned: 0,
                       commissionPercent: bill.commissionPercent
                   };
               }
               resellerSummary[key].totalBill += Number(bill.billAmount);
               resellerSummary[key].commissionEarned += (Number(bill.billAmount) * (Number(bill.commissionPercent)/100));
           });

           return (
              <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-8">
                 <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-4 gap-4">
                     <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center gap-2">
                         <i className="fa-solid fa-sack-dollar text-blue-500"></i> বেতন ও রিসেলার বিল
                     </h2>
                     <div className="flex bg-slate-100 rounded-lg p-1">
                         <button onClick={() => setActiveTab('staff')} className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${activeTab === 'staff' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>স্টাফ বেতন</button>
                         <button onClick={() => setActiveTab('reseller')} className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${activeTab === 'reseller' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>রিসেলার বিল</button>
                     </div>
                 </div>

                 {activeTab === 'staff' && (
                     <div className="animate-fade-in-up space-y-8">
                         {user.role === 'admin' && (
                            <div className="bg-blue-50/30 p-5 rounded-2xl border border-blue-100">
                              <h3 className="font-bold text-slate-800 mb-4">{editingSalId ? 'বেতন কনফিগারেশন এডিট' : 'নতুন মাসের বেতন কনফিগারেশন'}</h3>
                              <form onSubmit={submitSalaryConfig} className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                  <div>
                                      <label className="block text-xs font-bold mb-2 text-slate-700">স্টাফ</label>
                                      <select required value={empId} onChange={e=>setEmpId(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white">
                                          <option value="">-- নির্বাচন করুন --</option>
                                          {(users || []).filter(u=>u.role!=='admin').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                                      </select>
                                  </div>
                                  <div>
                                      <label className="block text-xs font-bold mb-2 text-slate-700">মাস</label>
                                      <input type="month" required value={month} onChange={e=>setMonth(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500" />
                                  </div>
                                  <div>
                                      <label className="block text-xs font-bold mb-2 text-slate-700">মূল বেতন (৳)</label>
                                      <input type="number" required value={baseSalary} onChange={e=>setBaseSalary(e.target.value)} className="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="0" />
                                  </div>
                                  <div className="flex gap-2">
