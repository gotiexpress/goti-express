    <style>

            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none;

                position: absolute !important;
                left: 0 !important;

            #invoice-modal > div {
                width: 210mm !important;

<body class="bg-[#0f172a] m-0 p-0 overflow-hidden" oncopy="return false" oncut="return false" oncontextmenu="return false">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBmJGTuAvMF9FM6MwOSi4BZqFmGyqb2Yd0",
            authDomain: "goti-express.firebaseapp.com",
            projectId: "goti-express",
            storageBucket: "goti-express.firebasestorage.app",
            messagingSenderId: "427378824805",
            appId: "1:427378824805:web:54373b156fc7f40f65588c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const formatDateEn = (date) => {
            try { return new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' }).format(date); }
            catch (e) { return 'Invalid'; }
        };
        const formatDateISO = (date) => {
            if(!date) return '';
            const d = new Date(date);
            if(isNaN(d)) return '';
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };
        const formatTimeEn = (date) => {
            return new Intl.DateTimeFormat('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true }).format(date);
        };
        const bengaliToEnglish = (str) => {
            if(!str) return '';
            return str.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d).toString());
        };
        const parseDateFromAnyFormat = (val) => {
            if (!val) return null;
            let s = bengaliToEnglish(val);
            let parts = s.split('/');
            if (parts.length === 3) {
                let d = parseInt(parts[0]), m = parseInt(parts[1])-1, y = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return new Date(y, m, d);
            }
            parts = s.split('-');
            if (parts.length === 3) {
                let y = parseInt(parts[0]), m = parseInt(parts[1])-1, d = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return new Date(y, m, d);
            }
            return null;
        };
        const migrateDates = (items, fields = ['date']) => {
            return items.map(item => {
                const newItem = {...item};
                fields.forEach(f => {
                    if (typeof newItem[f] === 'string') {
                        const d = parseDateFromAnyFormat(newItem[f]);
                        if (d && !isNaN(d)) newItem[f] = formatDateISO(d);
                    }
                });
                return newItem;
            });
        };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(storedValue)); } catch (error) {}
            }, [key, storedValue]);
            return [storedValue, setStoredValue];
        }

        function useDatabase(collectionName, initialData = []) {
            const [data, setData] = useState(() => {
                try {
                    const local = window.localStorage.getItem('goti_' + collectionName);
                    if (local) {
                        let parsed = JSON.parse(local);
                        if (['attendances','expenses','salaries','reports','incomes', 'costs', 'agWorks', 'agFbs', 'agProgs', 'agGraphics', 'agVideos', 'agSubs', 'agSales'].includes(collectionName)) {
                            parsed = migrateDates(parsed, ['date']);
                        }
                        return parsed || [];
                    }
                } catch(e) { console.error(e); }
                return initialData;
            });

            useEffect(() => {
                const unsubscribe = db.collection(collectionName).orderBy('id', 'desc').onSnapshot(snapshot => {
                    let docs = snapshot.docs.map(doc => doc.data());
                    if (docs.length > 0) {
                        if (['attendances','expenses','salaries','reports','incomes', 'costs', 'agWorks', 'agFbs', 'agProgs', 'agGraphics', 'agVideos', 'agSubs', 'agSales'].includes(collectionName)) {
                            docs = migrateDates(docs, ['date']);
                        }
                        setData(docs);
                        window.localStorage.setItem('goti_' + collectionName, JSON.stringify(docs));
                    } else if (initialData.length > 0) {
                        initialData.forEach(item => db.collection(collectionName).doc(item.id.toString()).set(item).catch(err => {}));
                    }
                }, error => console.error("Cloud Error:", error));
                return () => unsubscribe();
            }, [collectionName]);

            const addData = (newItem) => {
                const newData = [newItem, ...(data || [])];
                setData(newData);
                window.localStorage.setItem('goti_' + collectionName, JSON.stringify(newData));
                db.collection(collectionName).doc(newItem.id.toString()).set(newItem).catch(err => {});
            };

            const updateData = (id, updatedFields) => {
                const newData = (data || []).map(item => item.id === id ? { ...item, ...updatedFields } : item);
                setData(newData);
                window.localStorage.setItem('goti_' + collectionName, JSON.stringify(newData));
                db.collection(collectionName).doc(id.toString()).update(updatedFields).catch(err => {});
            };

            const deleteData = (id) => {
                const newData = (data || []).filter(item => item.id !== id);
                setData(newData);
                window.localStorage.setItem('goti_' + collectionName, JSON.stringify(newData));
                db.collection(collectionName).doc(id.toString()).delete().catch(err => {});
            };

            return [data || [], addData, updateData, deleteData];
        }

        const getCurrentTimeStr = () => {
            return new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Dhaka', year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', hour12: true 
            }).format(new Date());
        };

        const initialUsers = [
          { 
              id: 1, name: 'Admin', loginId: 'sreebashkumar65@gmail.com', password: '01815151122', 
              role: 'admin', designation: 'Administrator', avatar: null, 
              canInvest: true, canSubmitExp: true, canApproveExp: true, canPayExp: true, canViewReports: true, 
              canSubmitAttendance: true, canApproveLeave: true, canSubmitIncome: true, canManageCosts: true,
              canManageBanners: true, canManagePackages: true, canManageComplaints: true, canManageReviews: true, canManageFTP: true,
              canAgWork: true, canAgFb: true, canAgProg: true, canAgGraph: true, canAgVid: true, canAgSub: true, canAgSales: true
          }
        ];

        function App() {
          const [isLoggedIn, setIsLoggedIn] = useLocalStorage('goti_isLoggedIn', false);
          const [currentUser, setCurrentUser] = useLocalStorage('goti_currentUser', null);
          const [currentView, setCurrentView] = useLocalStorage('goti_currentView', 'dashboard');
          const [sidebarOpen, setSidebarOpen] = useState(false);

          const [dialog, setDialog] = useState({ open: false, type: '', msg: '', action: null, inputVal: '' });
          const showAlert = (msg) => setDialog({ open: true, type: 'alert', msg, action: null, inputVal: '' });
          const showConfirm = (msg, action) => setDialog({ open: true, type: 'confirm', msg, action, inputVal: '' });
          const showPrompt = (msg, action) => setDialog({ open: true, type: 'prompt', msg, action, inputVal: '' });

          // Basic Databases
          const [users, addUser, updateUser, deleteUser] = useDatabase('users', initialUsers);
          const [attendances, addAttendance] = useDatabase('attendances', []);
          const [leaves, addLeave, updateLeave, deleteLeave] = useDatabase('leaves', []);
          const [expenses, addExpense, updateExpense, deleteExpense] = useDatabase('expenses', []);
          const [reports, addReport, updateReport, deleteReport] = useDatabase('reports', []);
          const [payments, addPaymentBase, updatePayment, deletePayment] = useDatabase('payments', []);
          const [salaries, addSalaryBase, updateSalary, deleteSalary] = useDatabase('salaries', []);
          const [investments, addInvestment, updateInvestment, deleteInvestment] = useDatabase('investments', []);
          const [incomes, addIncome, updateIncome, deleteIncome] = useDatabase('incomes', []);
          const [costs, addCost, updateCost, deleteCost] = useDatabase('costs', []);
          const [logs, addLog] = useDatabase('logs', []);
          
          // Agency Databases
          const [agWorks, addAgWork, updateAgWork, deleteAgWork] = useDatabase('agWorks', []);
          const [agFbs, addAgFb, updateAgFb, deleteAgFb] = useDatabase('agFbs', []);
          const [agProgs, addAgProg, updateAgProg, deleteAgProg] = useDatabase('agProgs', []);
          const [agGraphics, addAgGraph, updateAgGraph, deleteAgGraph] = useDatabase('agGraphics', []);
          const [agVideos, addAgVid, updateAgVid, deleteAgVid] = useDatabase('agVideos', []);
          const [agSubs, addAgSub, updateAgSub, deleteAgSub] = useDatabase('agSubs', []);
          const [agSales, addAgSale, updateAgSale, deleteAgSale] = useDatabase('agSales', []);

          // Website DB
          const [webConfig, addConfig, updateConfig] = useDatabase('websiteConfig', [{id: 1, adsStatus: false, popupUrl: '', banners: [], ftpLink: ''}]);
          const [packages, addPackage, updatePackage, deletePackage] = useDatabase('packages', []);
          const [complaints, , , deleteComplaint] = useDatabase('complaints', []);
          const [reviews, , updateReview, deleteReview] = useDatabase('reviews', []);

          const todayISO = formatDateISO(new Date());
          const todayWebEn = new Date().toLocaleDateString('en-GB');
          const todayWebBn = new Date().toLocaleDateString('bn-BD');

          const hasNewAttendance = (attendances || []).some(a => a?.date === todayISO);
          const hasNewLeave = (leaves || []).some(l => l?.status === 'অপেক্ষমান');
          const hasNewExp = (expenses || []).some(e => e?.status === 'অপেক্ষমান');
          const hasNewReport = (reports || []).some(r => r?.date === todayISO);
          const hasNewIncome = (incomes || []).some(i => i?.date === todayISO);
          const hasNewPayment = (payments || []).some(p => p?.date === todayISO);
          const hasNewInvestment = (investments || []).some(i => i?.date === todayISO);
          const hasNewWeb = (complaints || []).some(c => c?.date === todayWebEn || c?.date === todayWebBn) || 
                            (reviews || []).some(r => r?.date === todayWebEn || r?.date === todayWebBn);

          const logAction = (action) => {
            if (!currentUser) return;
            addLog({ id: Date.now(), userId: currentUser.id, userName: currentUser.name, action, timestamp: new Date().toISOString() });
          };

          const addAttendanceWithLog = (item) => { addAttendance(item); logAction(`Submitted attendance`); };
          const addLeaveWithLog = (item) => { addLeave(item); logAction(`Applied leave`); };
          const addExpenseWithLog = (item) => { addExpense(item); logAction(`Added expense`); };
          const addReportWithLog = (item) => { addReport(item); logAction(`Submitted daily report`); };
          const addSalaryWithLog = (item) => { addSalaryBase(item); logAction(`Added salary entry`); };
          const addPaymentWithLog = (item) => { addPaymentBase(item); logAction(`Recorded payment`); };
          const addInvestmentWithLog = (item) => { addInvestment(item); logAction(`Added investment`); };
          const addIncomeWithLog = (item) => { addIncome(item); logAction(`Added income`); };
          const addCostWithLog = (item) => { addCost(item); logAction(`Added cost`); };
          const addUserWithLog = (item) => { addUser(item); logAction(`Added new staff`); };

          useEffect(() => {
              if (currentUser && users) {
                  const updatedMe = users.find(u => u.id === currentUser.id);
                  if (updatedMe && JSON.stringify(updatedMe) !== JSON.stringify(currentUser)) {
                      setCurrentUser(updatedMe);
                  }
              }
          }, [users, currentUser]);

          const handleLogin = (e) => {
            e.preventDefault();
            const loginId = e.target.loginId.value;
            const password = e.target.password.value;
            const user = (users || []).find(u => u.loginId === loginId && u.password === password);
            if (user) { 
                setCurrentUser(user); 
                setIsLoggedIn(true); 
                setCurrentView('dashboard'); 
                logAction('Logged in'); 
            } else { 
                showAlert('লগইন আইডি অথবা পাসওয়ার্ড ভুল হয়েছে!'); 
            }
          };

          const handleLogout = () => {
            showConfirm('আপনি কি লগআউট করতে চান?', () => {
              logAction('Logged out');
              setIsLoggedIn(false); 
              setCurrentUser(null);
            });
          };

          const updateUserProfile = (updatedUser) => {
            setCurrentUser(updatedUser);
            updateUser(updatedUser.id, { avatar: updatedUser.avatar });
            logAction('Updated profile picture');
          };

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-[#0f172a] flex flex-col items-center justify-center p-4">
                {dialog.open && <DialogBox dialog={dialog} setDialog={setDialog} />}
                <div className="mb-6 flex justify-center">
                   <img src="https://i.ibb.co.com/4Zy9b057/black-goti.png" alt="Logo" className="h-28 object-contain drop-shadow-2xl bg-white p-2 rounded-xl" />
                </div>
                <div className="max-w-md w-full bg-[#1e293b] border border-blue-900/50 rounded-2xl shadow-2xl p-8">
                  <div className="text-center mb-8">
                    <h1 className="text-3xl font-bold text-blue-400 mb-2">গতি এক্সপ্রেস</h1>
                    <p className="text-blue-200/60 text-sm">এডমিন ও স্টাফ প্যানেল</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-6">
                    <div>
                      <label className="block text-sm font-medium text-blue-200 mb-2 pl-1">লগইন আইডি</label>
                      <div className="relative">
                          <i className="fa-solid fa-user absolute left-4 top-3.5 text-slate-400"></i>
                          <input type="text" name="loginId" className="w-full pl-11 pr-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="ফোন বা ইমেইল" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-blue-200 mb-2 pl-1">পাসওয়ার্ড</label>
                      <div className="relative">
                          <i className="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                          <input type="password" name="password" className="w-full pl-11 pr-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="••••••••" />
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-blue-600 text-white py-3.5 rounded-xl hover:bg-blue-700 font-bold shadow-lg shadow-blue-900/50 mt-4 text-lg">লগইন করুন</button>
                  </form>
                </div>
              </div>
            );
          }

          const hasAgencyAccess = currentUser.role === 'admin' || currentUser.canAgWork || currentUser.canAgFb || currentUser.canAgProg || currentUser.canAgGraph || currentUser.canAgVid || currentUser.canAgSub || currentUser.canAgSales;

          return (
            <div className="flex h-screen bg-[#f1f5f9] overflow-hidden">
              {dialog.open && <DialogBox dialog={dialog} setDialog={setDialog} />}
              {sidebarOpen && <div className="md:hidden fixed inset-0 bg-slate-900/60 z-40 backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div>}

              {/* Sidebar */}
              <div className={`fixed inset-y-0 left-0 z-50 w-72 md:w-64 transform ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 transition-transform duration-300 ease-in-out bg-[#1e293b] flex flex-col shadow-2xl`}>
                <div className="p-4 bg-[#0f172a] flex items-center justify-between md:justify-center h-16 shrink-0 border-b border-slate-700">
                  <div className="flex items-center gap-3">
                      <img src="https://i.ibb.co.com/4Zy9b057/black-goti.png" alt="Logo" className="h-8 object-contain bg-white rounded p-1" />
                      <h2 className="text-xl font-bold text-blue-400 truncate">গতি এক্সপ্রেস</h2>
                  </div>
                  <button className="md:hidden text-slate-400 p-2" onClick={() => setSidebarOpen(false)}><i className="fa-solid fa-xmark text-xl"></i></button>
                </div>
                
                <div className="md:hidden p-4 border-b border-slate-700/50 bg-slate-800/30 flex items-center gap-3">
                    {currentUser.avatar ? <img src={currentUser.avatar} className="w-10 h-10 rounded-full border-2 border-blue-500 object-cover" /> : <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-white shadow-md">{currentUser.name.charAt(0)}</div>}
                    <div className="overflow-hidden">
                        <p className="text-white font-bold truncate">{currentUser.name}</p>
                        <p className="text-blue-300 text-xs truncate capitalize">{currentUser.role === 'admin' ? 'এডমিন' : 'স্টাফ'}</p>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto py-4">
                  <nav className="space-y-1.5 px-3">
                    <SidebarItem icon="fa-house" label="ড্যাশবোর্ড" active={currentView === 'dashboard'} onClick={() => {setCurrentView('dashboard'); setSidebarOpen(false);}} />
                    {currentUser.role === 'admin' && <SidebarItem icon="fa-users" label="স্টাফ প্রোফাইল" active={currentView === 'employees'} onClick={() => {setCurrentView('employees'); setSidebarOpen(false);}} />}
                    
                    {hasAgencyAccess && <SidebarItem icon="fa-building" label="এজেন্সি" active={currentView === 'agency'} onClick={() => {setCurrentView('agency'); setSidebarOpen(false);}} />}
                    
                    {(currentUser.role === 'admin' || currentUser.canSubmitAttendance) && <SidebarItem icon="fa-user-check" label="উপস্থিতি" active={currentView === 'attendance'} hasNew={currentUser.role === 'admin' && hasNewAttendance} onClick={() => {setCurrentView('attendance'); setSidebarOpen(false);}} />}
                    <SidebarItem icon="fa-calendar-day" label="ছুটি" active={currentView === 'leave'} hasNew={currentUser.role === 'admin' && hasNewLeave} onClick={() => {setCurrentView('leave'); setSidebarOpen(false);}} />
                    
                    {(currentUser.role === 'admin' || currentUser.canSubmitExp || currentUser.canApproveExp || currentUser.canPayExp) && <SidebarItem icon="fa-money-bill-wave" label="যাতায়াত ও বিল" active={currentView === 'expenses'} hasNew={currentUser.role === 'admin' && hasNewExp} onClick={() => {setCurrentView('expenses'); setSidebarOpen(false);}} />}
                    
                    {(currentUser.role === 'admin' || currentUser.canSubmitIncome) && <SidebarItem icon="fa-money-bill-trend-up" label="আয়" active={currentView === 'incomes'} hasNew={currentUser.role === 'admin' && hasNewIncome} onClick={() => {setCurrentView('incomes'); setSidebarOpen(false);}} />}
                    {(currentUser.role === 'admin' || currentUser.canManageCosts) && <SidebarItem icon="fa-money-check-dollar" label="ব্যয়" active={currentView === 'costs'} onClick={() => {setCurrentView('costs'); setSidebarOpen(false);}} />}
                    {(currentUser.role === 'admin' || currentUser.canViewReports) && <SidebarItem icon="fa-file-lines" label="ডেইলি রিপোর্ট" active={currentView === 'reports'} hasNew={currentUser.role === 'admin' && hasNewReport} onClick={() => {setCurrentView('reports'); setSidebarOpen(false);}} />}
                    
                    <SidebarItem icon="fa-sack-dollar" label="বেতন" active={currentView === 'salary'} onClick={() => {setCurrentView('salary'); setSidebarOpen(false);}} />
                    <SidebarItem icon="fa-wallet" label="পেমেন্ট" active={currentView === 'payments'} hasNew={currentUser.role === 'admin' && hasNewPayment} onClick={() => {setCurrentView('payments'); setSidebarOpen(false);}} />
                    {(currentUser.role === 'admin' || currentUser.canInvest) && <SidebarItem icon="fa-chart-line" label="ইনভেস্টমেন্ট" active={currentView === 'investments'} hasNew={currentUser.role === 'admin' && hasNewInvestment} onClick={() => {setCurrentView('investments'); setSidebarOpen(false);}} />}
                    {(currentUser.role === 'admin' || currentUser.canManageBanners || currentUser.canManagePackages || currentUser.canManageComplaints || currentUser.canManageReviews || currentUser.canManageFTP) && <SidebarItem icon="fa-globe" label="ওয়েবসাইট কন্ট্রোল" active={currentView === 'website'} hasNew={currentUser.role === 'admin' && hasNewWeb} onClick={() => {setCurrentView('website'); setSidebarOpen(false);}} />}
                    {currentUser.role === 'admin' && <SidebarItem icon="fa-clipboard-list" label="লগ" active={currentView === 'logs'} onClick={() => {setCurrentView('logs'); setSidebarOpen(false);}} />}
                  </nav>
                </div>
                <div className="p-4 border-t border-slate-700 bg-[#0f172a]/50">
                   <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-red-500/10 text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-colors font-semibold"><i className="fa-solid fa-power-off"></i> লগআউট</button>
                </div>
              </div>

              {/* Main Area */}
              <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                <header className="hidden md:flex h-16 bg-[#0f172a] text-white items-center justify-between px-6 shrink-0 shadow-md z-10">
                  <div className="flex items-center space-x-2 text-sm text-blue-300">
                      <i className="fa-solid fa-house text-xs"></i> <span>›</span> 
                      <span className="text-blue-100 font-medium capitalize">
                          {currentView === 'employees' ? 'স্টাফ প্রোফাইল' : currentView === 'agency' ? 'এজেন্সি' : currentView === 'attendance' ? 'উপস্থিতি' : currentView === 'leave' ? 'ছুটি' : currentView === 'expenses' ? 'যাতায়াত ও অন্যান্য বিল' : currentView === 'incomes' ? 'আয়' : currentView === 'costs' ? 'ব্যয়' : currentView === 'reports' ? 'ডেইলি রিপোর্ট' : currentView === 'salary' ? 'বেতন' : currentView === 'payments' ? 'পেমেন্ট' : currentView === 'investments' ? 'ইনভেস্টমেন্ট' : currentView === 'website' ? 'ওয়েবসাইট কন্ট্রোল' : currentView === 'logs' ? 'লগ' : 'ড্যাশবোর্ড'}
                      </span>
                  </div>
                  <div className="flex items-center space-x-5">
                    <div className="flex items-center space-x-3 pl-5">
                      <div className="text-right">
                          <p className="text-sm font-medium text-blue-50 leading-tight">{currentUser.name}</p>
                          <p className="text-xs text-blue-400 capitalize">{currentUser.role === 'admin' ? 'এডমিন' : 'স্টাফ'}</p>
                      </div>
                      {currentUser.avatar ? <img src={currentUser.avatar} className="w-9 h-9 rounded-full border-2 border-blue-500 object-cover" /> : <div className="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center font-bold text-sm shadow">{currentUser.name.charAt(0)}</div>}
                    </div>
                  </div>
                </header>

                <header className="md:hidden h-14 bg-[#0f172a] text-white flex items-center justify-between px-4 shrink-0 shadow-md z-10">
                  <div className="flex items-center gap-2">
                      <img src="https://i.ibb.co.com/4Zy9b057/black-goti.png" alt="Logo" className="h-6 object-contain bg-white rounded px-1" />
                      <span className="font-bold text-blue-100 capitalize">
                          {currentView === 'employees' ? 'স্টাফ' : currentView === 'agency' ? 'এজেন্সি' : currentView === 'attendance' ? 'উপস্থিতি' : currentView === 'leave' ? 'ছুটি' : currentView === 'expenses' ? 'বিল' : currentView === 'incomes' ? 'আয়' : currentView === 'costs' ? 'ব্যয়' : currentView === 'reports' ? 'রিপোর্ট' : currentView === 'salary' ? 'বেতন' : currentView === 'payments' ? 'পেমেন্ট' : currentView === 'investments' ? 'ইনভেস্টমেন্ট' : currentView === 'website' ? 'ওয়েবসাইট কন্ট্রোল' : currentView === 'logs' ? 'লগ' : 'ড্যাশবোর্ড'}
                      </span>
                  </div>
                </header>

                <main className="flex-1 overflow-x-hidden overflow-y-auto bg-[#e2e8f0] p-4 pb-24 md:pb-6 sm:p-6 lg:p-8">
                  <div className="max-w-7xl mx-auto">
                    {/* View Switcher */}
                    {currentView === 'dashboard' && <DashboardView user={currentUser} updateUser={updateUserProfile} />}
                    
                    {currentView === 'agency' && hasAgencyAccess && (
                        <AgencyView user={currentUser} users={users}
                            agWorks={agWorks} addAgWork={addAgWork} updateAgWork={updateAgWork} deleteAgWork={deleteAgWork}
                            agFbs={agFbs} addAgFb={addAgFb} updateAgFb={updateAgFb} deleteAgFb={deleteAgFb}
                            agProgs={agProgs} addAgProg={addAgProg} updateAgProg={updateAgProg} deleteAgProg={deleteAgProg}
                            agGraphics={agGraphics} addAgGraph={addAgGraph} updateAgGraph={updateAgGraph} deleteAgGraph={deleteAgGraph}
                            agVideos={agVideos} addAgVid={addAgVid} updateAgVid={updateAgVid} deleteAgVid={deleteAgVid}
                            agSubs={agSubs} addAgSub={addAgSub} updateAgSub={updateAgSub} deleteAgSub={deleteAgSub}
                            agSales={agSales} addAgSale={addAgSale} updateAgSale={updateAgSale} deleteAgSale={deleteAgSale}
                            showAlert={showAlert} showConfirm={showConfirm} logAction={logAction}
                        />
                    )}

                    {currentView === 'attendance' && (currentUser.role === 'admin' || currentUser.canSubmitAttendance) && <AttendanceView user={currentUser} attendances={attendances} addAttendance={addAttendanceWithLog} users={users} showAlert={showAlert} logAction={logAction} />}
                    {currentView === 'leave' && <LeaveView user={currentUser} leaves={leaves} addLeave={addLeaveWithLog} updateLeave={updateLeave} deleteLeave={deleteLeave} showConfirm={showConfirm} logAction={logAction} />}
                    
                    {currentView === 'expenses' && (currentUser.role === 'admin' || currentUser.canSubmitExp || currentUser.canApproveExp || currentUser.canPayExp) && <ExpenseView user={currentUser} expenses={expenses} addExpense={addExpenseWithLog} updateExpense={updateExpense} deleteExpense={deleteExpense} showConfirm={showConfirm} showPrompt={showPrompt} showAlert={showAlert} logAction={logAction} />}
                    {currentView === 'incomes' && (currentUser.role === 'admin' || currentUser.canSubmitIncome) && <IncomeView user={currentUser} incomes={incomes} addIncome={addIncomeWithLog} updateIncome={updateIncome} deleteIncome={deleteIncome} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />}
                    {currentView === 'costs' && (currentUser.role === 'admin' || currentUser.canManageCosts) && <CostView user={currentUser} costs={costs} addCost={addCostWithLog} updateCost={updateCost} deleteCost={deleteCost} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />}
                    
                    {currentView === 'reports' && (currentUser.role === 'admin' || currentUser.canViewReports) && <ReportView user={currentUser} reports={reports} addReport={addReportWithLog} deleteReport={deleteReport} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />}
                    {currentView === 'salary' && <SalaryView user={currentUser} users={users} salaries={salaries} addSalary={addSalaryWithLog} updateSalary={updateSalary} deleteSalary={deleteSalary} showAlert={showAlert} showConfirm={showConfirm} logAction={logAction} />}
                    {currentView === 'employees' && currentUser.role === 'admin' && <EmployeesView users={users} addUser={addUserWithLog} updateUser={updateUser} deleteUser={deleteUser} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />}
                    {currentView === 'payments' && <PaymentsView user={currentUser} payments={payments} addPayment={addPaymentWithLog} deletePayment={deletePayment} users={users} expenses={expenses} showAlert={showAlert} showConfirm={showConfirm} logAction={logAction} />}
                    {currentView === 'investments' && (currentUser.role === 'admin' || currentUser.canInvest) && <InvestView user={currentUser} investments={investments} addInvestment={addInvestmentWithLog} updateInvestment={updateInvestment} deleteInvestment={deleteInvestment} showConfirm={showConfirm} showAlert={showAlert} logAction={logAction} />}
                    {currentView === 'website' && (currentUser.role === 'admin' || currentUser.canManageBanners || currentUser.canManagePackages || currentUser.canManageComplaints || currentUser.canManageReviews || currentUser.canManageFTP) && <WebsiteSettingsView user={currentUser} config={webConfig[0] || {id: 1, adsStatus: false, popupUrl: '', banners: [], ftpLink: ''}} updateConfig={updateConfig} packages={packages} addPackage={addPackage} updatePackage={updatePackage} deletePackage={deletePackage} complaints={complaints} deleteComplaint={deleteComplaint} reviews={reviews} updateReview={updateReview} deleteReview={deleteReview} showAlert={showAlert} showConfirm={showConfirm} logAction={logAction} />}
                    {currentView === 'logs' && currentUser.role === 'admin' && <LogsView logs={logs} />}
                  </div>
                </main>

                <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 pb-safe pt-1 flex justify-around items-center h-[68px] z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] rounded-t-2xl">
                  <BottomNavItem icon="fa-house" label="ড্যাশবোর্ড" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                  {(currentUser.role === 'admin' || currentUser.canSubmitAttendance) && <BottomNavItem icon="fa-user-check" label="উপস্থিতি" active={currentView === 'attendance'} hasNew={currentUser.role==='admin' && hasNewAttendance} onClick={() => setCurrentView('attendance')} />}
                  <div className="relative -top-5">
                    <button onClick={() => setCurrentView((currentUser.role === 'admin' || currentUser.canSubmitIncome) ? 'incomes' : 'expenses')} className="w-14 h-14 bg-gradient-to-r from-[#2d1960] to-[#5e3186] rounded-full flex flex-col items-center justify-center text-white shadow-lg shadow-purple-500/40 border-4 border-[#e2e8f0] active:scale-95 transition-transform">
                        <i className={`fa-solid ${(currentUser.role === 'admin' || currentUser.canSubmitIncome) ? 'fa-money-bill-trend-up' : 'fa-money-bill-wave'} text-xl`}></i>
                    </button>
                    {currentUser.role === 'admin' && hasNewIncome && <span className="absolute right-0 top-0 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>}
                  </div>
                  <BottomNavItem icon="fa-sack-dollar" label="বেতন" active={currentView === 'salary'} onClick={() => setCurrentView('salary')} />
                  <BottomNavItem icon="fa-bars" label="মেনু" active={sidebarOpen} onClick={() => setSidebarOpen(true)} />
                </nav>
              </div>
            </div>
          );
        }

        function DialogBox({ dialog, setDialog }) {
          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-fade-in-up text-center">
                  <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 ${dialog.type === 'alert' ? 'bg-red-100 text-red-500' : dialog.type === 'confirm' ? 'bg-orange-100 text-orange-500' : 'bg-blue-100 text-blue-500'}`}>
                      <i className={`fa-solid text-3xl ${dialog.type === 'alert' ? 'fa-triangle-exclamation' : dialog.type === 'confirm' ? 'fa-question' : 'fa-info'}`}></i>
                  </div>
                  <h3 className="text-lg font-bold text-slate-800 mb-4">{dialog.msg}</h3>
                  {dialog.type === 'prompt' && <input type="text" autoFocus value={dialog.inputVal} onChange={e => setDialog({...dialog, inputVal: e.target.value})} className="w-full border border-slate-300 p-3 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="এখানে লিখুন..." />}
                  <div className="flex justify-center gap-3 mt-4">
                      {dialog.type === 'confirm' && <button onClick={() => setDialog({open: false})} className="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">বাতিল</button>}
                      <button onClick={() => { dialog.action && dialog.action(dialog.inputVal); setDialog({open: false}); }} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">ঠিক আছে</button>
                  </div>
              </div>
            </div>
          );
        }

        function SidebarItem({ icon, label, active, onClick, hasNew }) {
          return (
            <button onClick={onClick} className={`relative w-full flex items-center px-4 py-3.5 mb-1.5 text-sm rounded-xl transition-all duration-200 font-bold ${active ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
              <i className={`fa-solid ${icon} w-6 text-center mr-3 text-lg ${active ? 'text-white' : 'text-blue-400'}`}></i> {label}
              {hasNew && <span className="absolute right-4 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-pulse"></span>}
            </button>
          );
        }

        function BottomNavItem({ icon, label, active, onClick, hasNew }) {
          return (
            <button onClick={onClick} className={`relative flex flex-col items-center justify-center w-16 h-full transition-colors ${active ? 'text-blue-600' : 'text-slate-400'}`}>
              <i className={`fa-solid ${icon} text-xl mb-1 ${active ? 'animate-bounce-short' : ''}`}></i>
              <span className={`text-[10px] font-semibold tracking-wide ${active ? 'font-bold' : ''}`}>{label}</span>
              {hasNew && <span className="absolute right-4 top-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>}
            </button>
          );
        }

        function AgencyView(props) {
            const { user } = props;
            const isAdmin = user.role === 'admin';
            
            const tabs = [];
            if (isAdmin || user.canAgWork) tabs.push({ id: 'work', name: 'কাজের রিপোর্ট', icon: 'fa-tasks' });
            if (isAdmin || user.canAgFb) tabs.push({ id: 'fb', name: 'মার্কেটিং', icon: 'fa-bullhorn' });
            if (isAdmin || user.canAgProg) tabs.push({ id: 'prog', name: 'প্রোগ্রামিং', icon: 'fa-code' });
            if (isAdmin || user.canAgGraph) tabs.push({ id: 'graph', name: 'গ্রাফিক্স ডিজাইন', icon: 'fa-palette' });
            if (isAdmin || user.canAgVid) tabs.push({ id: 'vid', name: 'ভিডিও সম্পাদনা', icon: 'fa-video' });
            if (isAdmin || user.canAgSub) tabs.push({ id: 'sub', name: 'সাবস্ক্রিপশন', icon: 'fa-clock-rotate-left' });
            if (isAdmin || user.canAgSales) tabs.push({ id: 'sales', name: 'সেলস', icon: 'fa-cart-shopping' });

            const [activeTab, setActiveTab] = useState(tabs.length > 0 ? tabs[0].id : '');
            const [searchQuery, setSearchQuery] = useState('');

            if (tabs.length === 0) return <div className="p-8 text-center text-slate-500 font-bold bg-white rounded-2xl">আপনার এজেন্সির কোনো অ্যাক্সেস নেই।</div>;

            return (
                <div className="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
                    <div className="bg-gradient-to-r from-[#1e293b] to-blue-900 p-6 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold flex items-center gap-3"><i className="fa-solid fa-building text-blue-300"></i> এজেন্সি</h2>
                            <p className="text-blue-200 text-sm mt-1">আপনার সব ডিজিটাল প্রজেক্ট, কাজ এবং সেলস এখান থেকে পরিচালনা করুন</p>
                        </div>
                        <div className="relative w-full md:w-72">
                            <i className="fa-solid fa-search absolute left-3 top-3 text-blue-900"></i>
                            <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="নাম, নম্বর বা তথ্য খুঁজুন..." className="w-full pl-9 pr-4 py-2.5 rounded-xl bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-400 font-medium text-sm shadow-inner" />
                        </div>
                    </div>

                    <div className="flex overflow-x-auto bg-slate-50 border-b border-slate-200 scrollbar-hide">
                        {tabs.map(t => (
                            <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`px-5 py-4 text-sm font-bold whitespace-nowrap transition-colors border-b-2 ${activeTab === t.id ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}>
                                <i className={`fa-solid ${t.icon} mr-2`}></i> {t.name}
                            </button>
                        ))}
                    </div>

                    <div className="p-5 md:p-8 bg-[#f8fafc]">
                        {activeTab === 'work' && <AgWorkTab {...props} searchQuery={searchQuery} />}
                        {activeTab === 'fb' && <AgFbTab {...props} searchQuery={searchQuery} />}
                        {activeTab === 'prog' && <AgProgTab {...props} searchQuery={searchQuery} />}
                        {activeTab === 'graph' && <AgGraphTab {...props} searchQuery={searchQuery} />}
                        {activeTab === 'vid' && <AgVidTab {...props} searchQuery={searchQuery} />}
                        {activeTab === 'sub' && <AgSubTab {...props} searchQuery={searchQuery} />}
                        {activeTab === 'sales' && <AgSalesTab {...props} searchQuery={searchQuery} />}
                    </div>
                </div>
            );
        }

        const applySearch = (items, query) => {
            if (!query) return items;
            const q = query.toLowerCase();
            return items.filter(item => Object.values(item).some(val => val && val.toString().toLowerCase().includes(q)));
        };

        function AgWorkTab({ user, agWorks, addAgWork, updateAgWork, deleteAgWork, showAlert, showConfirm, logAction, searchQuery }) {
            const [editingId, setEditingId] = useState(null);
            const [workType, setWorkType] = useState('');
            const [link, setLink] = useState('');
            const [comment, setComment] = useState('');
            const [date, setDate] = useState(() => formatDateISO(new Date()));
            const [filterMonth, setFilterMonth] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; });

            const submitForm = (e) => {
                e.preventDefault();
                if(editingId) {
                    updateAgWork(editingId, { workType, link, comment, date });
                    setEditingId(null); showAlert('আপডেট হয়েছে!'); logAction('Updated Agency Work Report');
                } else {
                    addAgWork({ id: Date.now(), userId: user.id, userName: user.name, workType, link, comment, date });
                    showAlert('সাবমিট হয়েছে!'); logAction('Added Agency Work Report');
                }
                setWorkType(''); setLink(''); setComment(''); setDate(formatDateISO(new Date()));
            };

            const handleEdit = (item) => { setEditingId(item.id); setWorkType(item.workType); setLink(item.link); setComment(item.comment); setDate(item.date); window.scrollTo(0,0); };
            
            const monthFiltered = (agWorks || []).filter(i => i?.date && String(i.date).startsWith(filterMonth));
            const filtered = applySearch(monthFiltered, searchQuery);

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h3 className="font-bold text-lg text-slate-700">কাজের রিপোর্ট</h3>
                        <input type="month" value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="border border-slate-300 rounded-lg p-2 text-sm font-bold text-blue-700 outline-none" />
                    </div>

                    <form onSubmit={submitForm} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label className="block text-xs font-bold mb-1">তারিখ</label><input type="date" required value={date} onChange={e=>setDate(e.target.value)} className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                        <div><label className="block text-xs font-bold mb-1">কী কাজ করা হলো?</label><input required value={workType} onChange={e=>setWorkType(e.target.value)} className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="কাজের নাম..." /></div>
                        <div><label className="block text-xs font-bold mb-1">কাজের লিংক (যদি থাকে)</label><input value={link} onChange={e=>setLink(e.target.value)} className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://..." /></div>
                        <div><label className="block text-xs font-bold mb-1">মন্তব্য</label><input required value={comment} onChange={e=>setComment(e.target.value)} className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="বিস্তারিত..." /></div>
                        <div className="md:col-span-2 mt-2">
                            <button type="submit" className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold shadow-md hover:bg-blue-700">{editingId ? 'আপডেট করুন' : 'সাবমিট করুন'}</button>
                            {editingId && <button type="button" onClick={()=>{setEditingId(null); setWorkType(''); setLink(''); setComment('');}} className="ml-2 bg-slate-200 text-slate-700 px-6 py-3 rounded-lg font-bold">বাতিল</button>}
                        </div>
                    </form>

                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 border-b"><tr><th className="p-4 text-sm font-bold text-slate-600">তারিখ ও নাম</th><th className="p-4 text-sm font-bold text-slate-600">কাজের বিবরণ</th><th className="p-4 text-sm font-bold text-slate-600">লিংক</th><th className="p-4 text-sm font-bold text-slate-600">মন্তব্য</th>{user.role === 'admin' && <th className="p-4 text-sm font-bold text-slate-600 text-center">অ্যাকশন</th>}</tr></thead>
                            <tbody className="divide-y">
                                {filtered.length === 0 ? <tr><td colSpan="5" className="p-6 text-center text-slate-400">কোনো ডেটা নেই</td></tr> : filtered.map(item => (

                const d = new Date(startDateStr);
                d.setDate(d.getDate() + parseInt(days));

                const end = new Date(endDateStr);
                const today = new Date();
                today.setHours(0,0,0,0);
                const diffTime = Math.abs(end - today);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                if(end < today) return -diffDays; 
                return diffDays;
            };

            const submitForm = (e) => {
                e.preventDefault();
                const endDate = getEndDate(date, duration);
                if(editingId) {

                                <h4 className="font-bold text-slate-800 text-lg leading-tight pr-16">{item.custName}</h4>
                                {item.institution && <div className="text-xs text-slate-500 font-bold mb-2">{item.institution}</div>}
                                <div className="text-blue-700 font-bold text-sm mb-3 mt-1">{item.serviceDetails}</div>
                                
                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs text-slate-600 space-y-1 mb-3">

                                        <p className="text-slate-600 font-bold mt-1">Goti Express Digital Agency</p>
                                        <p className="text-sm text-slate-500 mt-1">Harishpur, Jhenaidah</p>
                                        <p className="text-sm text-slate-500">Phone: 01815151122</p>
                                    </div>
                                    <div className="text-right">
                                        <h2 className="text-3xl font-bold text-blue-600 uppercase tracking-widest">INVOICE</h2>

            const netPrice = (parseFloat(price) || 0) - ((parseFloat(price) || 0) * (parseFloat(discount) || 0) / 100);

            const submitForm = (e) => {
                e.preventDefault();
                if(editingId) {
                    updateAgSale(editingId, { custName, institution, phone, address, product, price: parseFloat(price), discount: parseFloat(discount)||0, netPrice, date });
                    setEditingId(null); showAlert('আপডেট হয়েছে!'); logAction('Updated Sales Data');
                } else {
                    addAgSale({ id: Date.now(), userId: user.id, userName: user.name, custName, institution, phone, address, product, price: parseFloat(price), discount: parseFloat(discount)||0, netPrice, date });
                    showAlert('সাবমিট হয়েছে!'); logAction('Added Sales Data');
                }
                setCustName(''); setInstitution(''); setPhone(''); setAddress(''); setProduct(''); setPrice(''); setDiscount(''); setDate(formatDateISO(new Date()));
            };

            const handleEdit = (item) => { setEditingId(item.id); setCustName(item.custName); setInstitution(item.institution); setPhone(item.phone); setAddress(item.address); setProduct(item.product); setPrice(item.price); setDiscount(item.discount); setDate(item.date); window.scrollTo(0,0); };

            const monthFiltered = (agSales || []).filter(i => i?.date && String(i.date).startsWith(filterMonth));

        function AttendanceView({ user, attendances, addAttendance, users, showAlert, logAction }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [cameraActive, setCameraActive] = useState(false);
            const [filterMonth, setFilterMonth] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; });

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    if (videoRef.current) { videoRef.current.srcObject = stream; setCameraActive(true); }
                } catch (err) { console.error(err); showAlert('ক্যামেরা চালু করা সম্ভব হয়নি!'); }
            };

            const captureAttendance = () => {
                if (!cameraActive || !videoRef.current) return;
                const canvas = canvasRef.current;
                const video = videoRef.current;
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const photo = canvas.toDataURL('image/jpeg', 0.5);
                const now = new Date();
                const timeStr = formatTimeEn(now);
                const dateStr = formatDateISO(now);

                addAttendance({ id: Date.now(), userId: user.id, userName: user.name, date: dateStr, time: timeStr, photo });
                showAlert('উপস্থিতি সাবমিট হয়েছে!');
                
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    setCameraActive(false);
                }
            };

            const displayAttendances = user.role === 'admin' ? (attendances || []) : (attendances || []).filter(a => a.userId === user.id);
            const filtered = displayAttendances.filter(a => a.date && a.date.startsWith(filterMonth));

            return (
                <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6 animate-fade-in-up">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                        <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center gap-2"><i className="fa-solid fa-user-check text-blue-500"></i> উপস্থিতি (Attendance)</h2>
                        <input type="month" value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="bg-slate-50 border border-slate-200 text-sm font-bold text-blue-700 outline-none p-2 rounded-lg" />
                    </div>

                    {(user.role === 'admin' || user.canSubmitAttendance) && (
                        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col md:flex-row gap-6 items-center">
                            <div className="w-full md:w-1/2 max-w-sm">
                                <div className="aspect-video bg-black rounded-xl overflow-hidden relative shadow-inner">
                                    <video ref={videoRef} autoPlay playsInline muted className={`w-full h-full object-cover ${cameraActive ? '' : 'hidden'}`} style={{ transform: 'scaleX(-1)' }}></video>
                                    {!cameraActive && <div className="absolute inset-0 flex items-center justify-center text-white flex-col"><i className="fa-solid fa-camera text-4xl mb-2 opacity-50"></i><p className="text-sm text-slate-300">ক্যামেরা বন্ধ</p></div>}
                                </div>
                                <canvas ref={canvasRef} className="hidden"></canvas>
                            </div>
                            <div className="w-full md:w-1/2 space-y-4">
                                <button onClick={startCamera} disabled={cameraActive} className={`w-full py-3 rounded-xl font-bold text-white shadow-md transition ${cameraActive ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}><i className="fa-solid fa-video mr-2"></i> ক্যামেরা চালু করুন</button>
                                <button onClick={captureAttendance} disabled={!cameraActive} className={`w-full py-3 rounded-xl font-bold text-white shadow-md transition ${!cameraActive ? 'bg-slate-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 active:scale-95'}`}><i className="fa-solid fa-clipboard-check mr-2"></i> উপস্থিতি দিন</button>
                            </div>
                        </div>
                    )}

                    <div className="overflow-x-auto rounded-xl border border-slate-200 mt-6">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
                                    <th className="p-4 font-bold">তারিখ</th>
                                    <th className="p-4 font-bold">নাম</th>
                                    <th className="p-4 font-bold">সময়</th>
                                    <th className="p-4 font-bold text-center">ছবি</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filtered.length === 0 ? <tr><td colSpan="4" className="p-8 text-center text-slate-400 font-medium">কোনো রেকর্ড নেই</td></tr> : filtered.map(att => (
                                    <tr key={att.id} className="hover:bg-slate-50 transition">
                                        <td className="p-4 text-slate-600 font-medium">{formatDateEn(new Date(att.date))}</td>
                                        <td className="p-4 font-bold text-slate-800">{att.userName}</td>
                                        <td className="p-4"><span className="bg-blue-50 text-blue-700 px-2 py-1 rounded-md text-xs font-bold">{att.time}</span></td>
                                        <td className="p-4 text-center"><img src={att.photo} className="w-10 h-10 object-cover rounded-lg mx-auto shadow-sm border border-slate-200" style={{ transform: 'scaleX(-1)' }} alt="Att" /></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function LeaveView({ user, leaves, addLeave, updateLeave, deleteLeave, showConfirm, logAction }) {
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [reason, setReason] = useState('');
            
            const submitLeave = (e) => {
                e.preventDefault();
                addLeave({ id: Date.now(), userId: user.id, userName: user.name, startDate, endDate, reason, requestDate: formatDateISO(new Date()), status: 'অপেক্ষমান' });
                setStartDate(''); setEndDate(''); setReason('');
                logAction('Submitted leave request');
            };

            const canApprove = user.role === 'admin' || user.canApproveLeave;
            const displayLeaves = canApprove ? (leaves || []) : (leaves || []).filter(l => l.userId === user.id);

            return (
                <div className="bg-white p-5 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6 animate-fade-in-up">
                    <h2 className="text-xl md:text-2xl font-bold text-slate-800 border-b border-slate-100 pb-4 flex items-center gap-2"><i className="fa-solid fa-calendar-day text-blue-500"></i> ছুটির আবেদন</h2>
                    
                    {user.role !== 'admin' && (
                        <form onSubmit={submitLeave} className="bg-blue-50/50 p-6 rounded-2xl border border-blue-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label className="block text-sm font-bold text-slate-700 mb-2">শুরুর তারিখ</label><input type="date" required value={startDate} onChange={e=>setStartDate(e.target.value)} className="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-2">শেষ তারিখ</label><input type="date" required value={endDate} onChange={e=>setEndDate(e.target.value)} className="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" /></div>
                            <div className="md:col-span-2"><label className="block text-sm font-bold text-slate-700 mb-2">কারণ</label><textarea required value={reason} onChange={e=>setReason(e.target.value)} className="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 h-24"></textarea></div>
                            <div className="md:col-span-2"><button type="submit" className="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-md transition w-full md:w-auto">আবেদন করুন</button></div>
                        </form>
                    )}

                    <div className="grid grid-cols-1 gap-4">
                        {displayLeaves.length === 0 ? <div className="p-8 text-center text-slate-400 bg-slate-50 rounded-xl border border-dashed">কোনো রেকর্ড নেই</div> : displayLeaves.map(l => (
                            <div key={l.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                                {user.role === 'admin' && <button onClick={()=>showConfirm('ডিলিট করবেন?', ()=>deleteLeave(l.id))} className="absolute top-4 right-4 text-red-400 hover:text-red-600"><i className="fa-solid fa-trash-can"></i></button>}

        function ReportView({ user, reports, addReport, deleteReport, showConfirm, showAlert, logAction }) {
            const defaultReportFormat = `১. সম্পন্ন করা কাজ:\n- \n\n২. অসমাপ্ত কাজ:\n- \n\n৩. মন্তব্য:\n- `;
            const [customers, setCustomers] = useState(''); const [reportText, setReportText] = useState(defaultReportFormat);
            const submitReport = (e) => { e.preventDefault(); addReport({ id: Date.now(), userId: user.id, userName: user.name, customers: parseInt(customers)||0, reportText, date: formatDateISO(new Date()) }); setCustomers(''); setReportText(defaultReportFormat); showAlert('রিপোর্ট জমা হয়েছে!'); };
            const displayReports = user.role === 'admin' || user.canViewReports ? (reports || []) : (reports || []).filter(r => r.userId === user.id);
            return (

        }

        function SalaryView({ user, users, salaries, addSalary, updateSalary, deleteSalary, showAlert, showConfirm, logAction }) {
            const [editingSalId, setEditingSalId] = useState(null); const [empId, setEmpId] = useState(''); const [month, setMonth] = useState(''); const [baseSalary, setBaseSalary] = useState(''); const [additions, setAdditions] = useState(''); const [deductions, setDeductions] = useState(''); const [deductionReason, setDeductionReason] = useState(''); const [status, setStatus] = useState('পেন্ডিং');
            const submitSalary = (e) => { e.preventDefault(); const emp = (users||[]).find(u=>u.id.toString()===empId); if(!emp) return; const netSalary=(parseFloat(baseSalary)||0)-(parseFloat(additions)||0)-(parseFloat(deductions)||0); if(editingSalId) { updateSalary(editingSalId, { userId: emp.id, userName: emp.name, month, baseSalary: parseFloat(baseSalary)||0, additions: parseFloat(additions)||0, deductions: parseFloat(deductions)||0, deductionReason, status, netSalary }); setEditingSalId(null); showAlert('আপডেট হয়েছে!'); } else { addSalary({ id: Date.now(), userId: emp.id, userName: emp.name, month, baseSalary: parseFloat(baseSalary)||0, additions: parseFloat(additions)||0, deductions: parseFloat(deductions)||0, deductionReason, status, netSalary }); showAlert('সেভ হয়েছে!'); } setEmpId(''); setMonth(''); setBaseSalary(''); setAdditions(''); setDeductions(''); setDeductionReason(''); setStatus('পেন্ডিং'); };
            const handleEditSalary = (sal) => { setEditingSalId(sal.id); setEmpId(sal.userId.toString()); setMonth(sal.month); setBaseSalary(sal.baseSalary.toString()); setAdditions(sal.additions.toString()); setDeductions(sal.deductions.toString()); setDeductionReason(sal.deductionReason||''); setStatus(sal.status); window.scrollTo(0,0); };

                    {user.role === 'admin' && <form onSubmit={submitSalary} className="bg-blue-50/30 p-5 rounded-2xl border border-blue-100 grid grid-cols-1 md:grid-cols-3 gap-4"><div className="md:col-span-3 font-bold text-slate-700">{editingSalId ? 'এডিট করুন' : 'বেতন এন্ট্রি'}</div><div><label className="block text-xs font-bold mb-2">স্টাফ</label><select required value={empId} onChange={e=>setEmpId(e.target.value)} className="w-full border p-3 rounded-xl bg-white"><option value="">-- নির্বাচন করুন --</option>{(users||[]).filter(u=>u.role!=='admin').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div><div><label className="block text-xs font-bold mb-2">মাস</label><input type="month" required value={month} onChange={e=>setMonth(e.target.value)} className="w-full border p-3 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">মূল বেতন (৳)</label><input type="number" required value={baseSalary} onChange={e=>setBaseSalary(e.target.value)} className="w-full border p-3 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">অগ্রিম জমা (-)</label><input type="number" value={additions} onChange={e=>setAdditions(e.target.value)} className="w-full border p-3 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">কর্তন (-)</label><input type="number" value={deductions} onChange={e=>setDeductions(e.target.value)} className="w-full border p-3 rounded-xl" /></div><div><label className="block text-xs font-bold mb-2">কারণ</label><input type="text" value={deductionReason} onChange={e=>setDeductionReason(e.target.value)} className="w-full border p-3 rounded-xl" /></div><div className="md:col-span-3 flex gap-2"><button type="submit" className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">{editingSalId?'আপডেট':'সেভ'}</button>{editingSalId && <button type="button" onClick={()=>{setEditingSalId(null);}} className="bg-slate-200 px-6 py-3 rounded-xl font-bold">বাতিল</button>}</div></form>}
                    <div className="grid grid-cols-1 gap-4">{displaySalaries.length===0?<div className="p-6 text-center text-slate-400">কোনো রেকর্ড নেই</div>:displaySalaries.map(sal=><div key={sal.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative">{user.role==='admin' && <div className="absolute top-4 right-4 flex gap-2"><button onClick={()=>handleEditSalary(sal)} className="text-blue-500 bg-blue-50 p-2 rounded"><i className="fa-solid fa-pen"></i></button><button onClick={()=>showConfirm('ডিলিট করবেন?', ()=>deleteSalary(sal.id))} className="text-red-500 bg-red-50 p-2 rounded"><i className="fa-solid fa-trash"></i></button></div>}<div className="font-bold text-slate-800">{sal.userName} <span className="text-slate-400 text-xs font-normal">({sal.month})</span></div><span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold my-1 inline-block">{sal.status}</span><div className="font-black text-green-600 text-xl mt-1">Net: ৳{sal.netSalary}</div>{user.role==='admin'&&sal.status!=='পেইড' && <div className="mt-3 flex gap-2">{sal.status==='পেন্ডিং'&&<button onClick={()=>updateSalary(sal.id,{status:'অনুমোদিত'})} className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold">Approve</button>}{sal.status==='অনুমোদিত'&&<button onClick={()=>updateSalary(sal.id,{status:'পেইড'})} className="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold">Mark Paid</button>}</div>}</div>)}</div>
                </div>

        }

            const resetForm = () => { setEditingId(null); setName(''); setLoginId(''); setPassword(''); setDesignation(''); setCanSubmitAttendance(false); setCanApproveLeave(false); setCanViewReports(false); setCanSubmitExp(true); setCanApproveExp(false); setCanPayExp(false); setCanSubmitIncome(false); setCanManageCosts(false); setCanInvest(false); setCanManageBanners(false); setCanManagePackages(false); setCanManageComplaints(false); setCanManageReviews(false); setCanManageFTP(false); setCanAgWork(false); setCanAgFb(false); setCanAgProg(false); setCanAgGraph(false); setCanAgVid(false); setCanAgSub(false); setCanAgSales(false); };
